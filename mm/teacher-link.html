<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>رصد غياب الطلبة | التحضير الذكي</title>
  <style>
    :root{color-scheme:light;--ink:#142c43;--muted:#425970;--line:#cbd9e3;--green:#175d56}
    *{box-sizing:border-box}
    body{margin:0;background:#f0f5f8;color:var(--ink);font:1rem/1.7 system-ui,sans-serif}
    main{max-width:46rem;margin:auto;padding:clamp(.85rem,4vw,2rem)}
    header,section{border-radius:1rem;margin-block-end:1rem;padding:clamp(1rem,4vw,1.6rem)}
    header{color:#fff;background:#133b46}
    section{background:#fff;border:1px solid var(--line)}
    h1,h2,p{margin:0}h1{font-size:clamp(1.4rem,5vw,2rem)}h2{font-size:1.15rem}
    fieldset{border:0;padding:0;margin:0;min-width:0}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-block:1rem}
    label{font-weight:650}
    select,button,.action{min-height:44px;padding:.4rem .75rem;border-radius:.6rem;font:inherit}
    select{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .fields select{display:block;width:100%}
    button,.action{display:inline-flex;align-items:center;background:var(--green);border:1px solid var(--green);color:#fff;text-decoration:none;cursor:pointer}
    :focus-visible{outline:3px solid #237970;outline-offset:3px}
    .student-list{list-style:none;padding:0;margin:.75rem 0}
    .student-list label{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.75rem;padding:.55rem 0;border-block-end:1px solid var(--line)}
    .student-list span{overflow-wrap:anywhere}
    .muted{color:var(--muted)}
    .status{margin-block:.75rem;color:var(--muted)}
    .status.error{color:#982e23}
    [hidden]{display:none!important}
    @media(max-width:500px){.fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header>
      <p id="school">التحضير الذكي</p>
      <h1>رصد غياب الطلبة</h1>
      <p id="date"></p>
    </header>
    <section aria-label="رصد المعلم">
      <form id="attendance" hidden>
        <p id="teacher"></p>
        <fieldset id="controls">
          <div class="fields">
            <label>الصف أو الشعبة<select id="class-select" required></select></label>
            <label>الحصة<select id="period" required disabled></select></label>
          </div>
          <div id="capture" hidden>
            <h2>قائمة الطلبة</h2>
            <p class="muted">الطلبة حاضرون افتراضيًا. غيّر الحالات المطلوبة ثم اعتمد الرصد.</p>
            <ol class="student-list" id="students"></ol>
            <p class="status" id="tally" aria-live="polite"></p>
            <button type="submit">اعتماد الرصد</button>
          </div>
        </fieldset>
      </form>
      <p id="status" class="status" role="status">جارٍ التحقق من الرابط والاشتراك…</p>
      <a class="action" id="login" href="/enjazy/auth.html?mode=login&amp;reauth=attendance&amp;return=%2Fmm%2Fteacher-link.html" hidden>تسجيل الدخول</a>
      <a class="action" id="subscribe" href="/subscription.html" hidden>إدارة الاشتراك</a>
      <button type="button" id="retry" hidden>إعادة المحاولة</button>
    </section>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const form = byId('attendance'), classSelect = byId('class-select'), period = byId('period');
    const studentList = byId('students'), capture = byId('capture'), controls = byId('controls');
    const validToken = /^[A-Za-z0-9_-]{43}$/;
    const storageKey = 'mm_attendance_link';
    const fromHash = location.hash.slice(1);
    let token = fromHash;
    try{
      if(validToken.test(fromHash)) sessionStorage.setItem(storageKey, fromHash);
      if(!fromHash) token = sessionStorage.getItem(storageKey) || '';
    }catch{}
    let serial = 0;
    let submitting = false;
    let attendanceDate = '';

    function setStatus(text, error = false){
      byId('status').textContent = text;
      byId('status').classList.toggle('error', error);
      byId('login').hidden = true;
      byId('subscribe').hidden = true;
      byId('retry').hidden = true;
    }

    async function request(action, fields = {}){
      const response = await fetch('/api/ghiyab-teacher-link', {
        method:'POST', credentials:'same-origin', cache:'no-store',
        headers:{'Content-Type':'application/json'},
        signal:AbortSignal.timeout?.(15000),
        body:JSON.stringify({action, token, ...fields})
      });
      const result = await response.json().catch(() => ({}));
      if(!response.ok) throw Object.assign(new Error('تعذّر الاتصال بخدمة الرصد. أعد المحاولة.'), {code:result.error});
      return result;
    }

    function handleError(error){
      const errors = {
        link_unavailable:'انتهت صلاحية الرابط أو أوقفته الإدارة. اطلب الرابط الجديد من مدرستك.',
        sign_in_required:'سجّل الدخول إلى التحضير الذكي بحساب المعلم لفتح رابط الرصد.',
        subscription_required:'يلزم اشتراك ساري في التحضير الذكي لاعتماد الرصد.',
        account_stopped:'حساب التحضير الذكي موقوف. تواصل مع الإدارة.',
        invalid_selection:'تحقّق من اسمك في بيانات حساب التحضير الذكي ثم أعد فتح الرابط.',
        already_submitted:'سبق اعتماد الرصد لهذه الحصة. حدّث القائمة.',
        date_changed:'بدأ يوم جديد بتوقيت عُمان. اضغط «إعادة المحاولة» لتحميل قائمة اليوم قبل اعتماد الرصد.'
      };
      const locked = ['link_unavailable','sign_in_required','subscription_required','account_stopped'].includes(error.code);
      if(locked){
        form.hidden = true;
        studentList.replaceChildren();
      }
      setStatus(errors[error.code] || 'تعذّر تحميل الرصد. أعد المحاولة.', true);
      byId('login').hidden = error.code !== 'sign_in_required';
      byId('subscribe').hidden = error.code !== 'subscription_required';
      byId('retry').hidden = locked;
    }

    function updateTally(){
      const counts = {a:0,e:0,l:0};
      for(const item of studentList.querySelectorAll('select')) if(item.value) counts[item.value]++;
      byId('tally').textContent = `غائب ${counts.a} · بعذر ${counts.e} · متأخر ${counts.l}`;
    }

    function renderRoster({students, captured, periods, date}){
      attendanceDate = date;
      byId('date').textContent = date;
      const available = Array.from({length:periods}, (_, index) => index + 1).filter(item => !captured.includes(item));
      period.replaceChildren(...available.map(item => new Option('الحصة ' + item, String(item))));
      period.disabled = !available.length;
      capture.hidden = !students.length || !available.length;
      studentList.replaceChildren();
      if(capture.hidden){
        setStatus(students.length ? 'اكتمل رصد حصص هذا الصف.' : 'لا توجد أسماء طلبة في هذا الصف.');
        return;
      }
      for(const {key, name} of students){
        const li = document.createElement('li'), label = document.createElement('label');
        const text = document.createElement('span'), select = document.createElement('select');
        text.textContent = name;
        select.dataset.student = String(key);
        select.append(new Option('حاضر',''),new Option('غائب','a'),new Option('غائب بعذر','e'),new Option('متأخر','l'));
        label.append(text, select);
        li.append(label);
        studentList.append(li);
      }
      updateTally();
      setStatus('');
    }

    async function loadRoster(){
      const current = ++serial;
      capture.hidden = true;
      period.disabled = true;
      studentList.replaceChildren();
      if(classSelect.value === '') return setStatus('');
      setStatus('جارٍ تحميل طلبة الصف…');
      try{
        const result = await request('roster', {classKey:Number(classSelect.value)});
        if(current === serial) renderRoster(result);
      }catch(error){
        if(current === serial) handleError(error);
      }
    }

    async function openLink(){
      if(!validToken.test(token)) return handleError({code:'link_unavailable'});
      try{
        const result = await request('view');
        if(!Array.isArray(result.classes)) return handleError({code:'link_unavailable'});
        if((result.teacher || '').trim().length < 3) return handleError({code:'invalid_selection'});
        byId('school').textContent = result.school;
        attendanceDate = result.date;
        byId('date').textContent = attendanceDate;
        byId('teacher').textContent = 'المعلم: ' + result.teacher;
        classSelect.replaceChildren(new Option('اختر الصف أو الشعبة',''), ...result.classes.map(item => new Option(item.className,String(item.key))));
        form.hidden = false;
        setStatus('');
      }catch(error){ handleError(error); }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if(submitting || capture.hidden || !period.value || classSelect.value === '') return;
      const marks = [...studentList.querySelectorAll('select')].filter(item => item.value)
        .map(item => ({key:Number(item.dataset.student), status:item.value}));
      if(!confirm(marks.length ? 'هل تريد اعتماد الحالات المحددة؟' : 'هل تريد اعتماد حضور جميع الطلبة؟')) return;
      submitting = true;
      controls.disabled = true;
      setStatus('جارٍ حفظ الرصد…');
      try{
        await request('submit', {classKey:Number(classSelect.value), period:Number(period.value), date:attendanceDate, marks});
        await loadRoster();
        if(form.hidden === false && byId('status').classList.contains('error') === false){
          setStatus('تم حفظ الرصد. يمكن لإدارة المدرسة مراجعته في نتائج رصد المعلمين.');
        }
      }catch(error){
        if(error.code === 'date_changed') capture.hidden = true;
        handleError(error);
      }
      finally{
        controls.disabled = false;
        submitting = false;
      }
    });
    classSelect.addEventListener('change', loadRoster);
    period.addEventListener('change', () => {
      studentList.querySelectorAll('select').forEach(item => { item.value = ''; });
      updateTally();
    });
    studentList.addEventListener('change', updateTally);
    byId('retry').addEventListener('click', () => {
      if(form.hidden || classSelect.value === '') void openLink();
      else void loadRoster();
    });
    window.addEventListener('pageshow', event => { if(event.persisted) location.reload(); });
    void openLink();
  </script>
</body>
</html>
