<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رصد غياب الطلبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: sticky top bar, one centered working column; phone-first because teachers mark absence in class */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e9efed; --ink:#13221e; --muted:#5a6d67; --line:#d9e2df;
  --accent:#0e6a51; --accent-ink:#ffffff; --accent-soft:#e0f0ea;
  --absent:#bf3a2b; --absent-soft:#fbe8e5; --late:#a86d12; --late-soft:#fbf0dc; --excused:#2a66a8; --excused-soft:#e5eef9; --ok:#1d7f55; --ok-soft:#e2f3ea;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,40,30,.06),0 4px 14px rgba(10,40,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#15201d; --sunk:#1b2925; --ink:#e4eeea; --muted:#94a8a1; --line:#273732;
    --accent:#45c79b; --accent-ink:#062419; --accent-soft:#163a2f;
    --absent:#f08072; --absent-soft:#3b1f1b; --late:#e3b35c; --late-soft:#3a2d15; --excused:#82b3ee; --excused-soft:#192b42; --ok:#5fd19f; --ok-soft:#173528;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --sunk:#1b2925; --ink:#e4eeea; --muted:#94a8a1; --line:#273732;
  --accent:#45c79b; --accent-ink:#062419; --accent-soft:#163a2f;
  --absent:#f08072; --absent-soft:#3b1f1b; --late:#e3b35c; --late-soft:#3a2d15; --excused:#82b3ee; --excused-soft:#192b42; --ok:#5fd19f; --ok-soft:#173528;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;min-width:0;flex:1}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-display);font-size:1.02rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.8rem;display:block}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a,.nav button{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;border:0;background:none;cursor:pointer;font-size:.94rem}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a:hover,.nav button:hover{color:var(--ink)}
.banner{max-width:1120px;margin:12px auto 0;padding:0 16px}
.banner div{background:var(--late-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--late) 35%,transparent);border-radius:10px;padding:8px 12px;font-size:.9rem}

main{max-width:1120px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:20px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--absent);border-color:var(--absent);color:#fff}
.btn.ghost{background:transparent}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
label.f span.hint,.hint{font-weight:400;color:var(--muted);font-size:.84rem}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],input[type=url],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.88rem;direction:ltr;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.a{background:var(--absent-soft);color:var(--absent)}
.pill.l{background:var(--late-soft);color:var(--late)}
.pill.e{background:var(--excused-soft);color:var(--excused)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.pend{background:var(--sunk);color:var(--muted)}
.pill.demo{background:var(--late-soft);color:var(--late)}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero .intro{display:flex;flex-direction:column;gap:8px;justify-content:center}
.eyebrow{color:var(--accent);font-weight:600;font-size:.88rem}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.role{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--accent);transform:translateY(-1px)}
.role .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.role h2{font-size:1.15rem;margin-bottom:4px}
.progress{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-inline-start:4px solid var(--line)}
.kpi span{color:var(--muted);font-size:.86rem;display:block}
.kpi b{font-family:var(--font-display);font-size:1.7rem;line-height:1.2}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi.a{border-inline-start-color:var(--absent)} .kpi.l{border-inline-start-color:var(--late)} .kpi.ok{border-inline-start-color:var(--ok)} .kpi.e{border-inline-start-color:var(--excused)}

/* teacher */
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;border-inline-start:4px solid var(--line);min-height:96px}
.ccard:hover{border-color:var(--accent)}
.ccard b{font-family:var(--font-display);font-size:1.05rem}
.ccard.done{border-inline-start-color:var(--ok)}
.ccard.pend{border-inline-start-color:var(--muted)}
.roster-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stu{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;border-inline-start:4px solid transparent}
.stu .num{width:28px;text-align:center;color:var(--muted);font-size:.85rem;flex:none}
.stu .nm{flex:1;font-weight:500;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.stu.st-a{border-inline-start-color:var(--absent);background:var(--absent-soft)}
.stu.st-l{border-inline-start-color:var(--late);background:var(--late-soft)}
.stu.st-e{border-inline-start-color:var(--excused);background:var(--excused-soft)}
.seg{display:flex;gap:4px;flex:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[data-v="a"][aria-pressed="true"]{background:var(--absent);border-color:var(--absent);color:#fff}
.seg button[data-v="l"][aria-pressed="true"]{background:var(--late);border-color:var(--late);color:#fff}
.seg button[data-v="e"][aria-pressed="true"]{background:var(--excused);border-color:var(--excused);color:#fff}
.submitbar{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.submitbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tally{display:flex;gap:14px;flex-wrap:wrap;flex:1;font-size:.92rem}
.tally b{font-family:var(--font-display);font-size:1.15rem}
.tally .ta b{color:var(--absent)} .tally .tl b{color:var(--late)} .tally .te b{color:var(--excused)} .tally .tp b{color:var(--ok)}
.done-card{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.done-card .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--sunk);font-weight:600;color:var(--muted);font-size:.84rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:center}
.tbl-wrap td{white-space:nowrap}

/* admin */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sbox{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;border-inline-start:4px solid var(--line);background:var(--surface)}
.sbox.done{border-inline-start-color:var(--ok)} .sbox.pend{border-inline-start-color:var(--late);background:var(--late-soft)}
.sbox b{font-size:.95rem}
.alert-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-inline-start:5px solid var(--late);background:var(--surface)}
.alert-card.crit{border-inline-start-color:var(--absent)}
.alert-card .who{flex:1;min-width:180px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}

/* welcome and setup */
.setup.welcome{max-width:920px}
.welcome-hero{padding:clamp(20px,5vw,44px);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.welcome-hero h1{font-size:clamp(1.65rem,4vw,2.5rem);margin-block:10px}
.welcome-hero .mark{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:var(--accent);color:var(--accent-ink)}
.welcome-hero .row{margin-top:18px}
.welcome-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.welcome-steps li{padding:16px;box-shadow:none}
.welcome-steps h2{margin-block:6px;font-size:1.12rem}
.welcome-steps p,.welcome-note p{margin:0}
.welcome-note{padding:16px}
.welcome-note h2{margin-bottom:6px;font-size:1.12rem}
@media(max-width:720px){.welcome-steps{grid-template-columns:1fr}}
.setup{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:8px}
.steps div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted);font-weight:600}
.steps div i{height:5px;border-radius:9px;background:var(--line)}
.steps div.on{color:var(--accent)} .steps div.on i{background:var(--accent)}
.preview-chips{display:flex;flex-wrap:wrap;gap:6px}
.preview-chips span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:.86rem;font-weight:600}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-cards label{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.radio-cards label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-cards input{margin-top:5px;accent-color:var(--accent)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:40}
.modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(760px,calc(100% - 32px))}
.m-actions{display:flex;gap:8px;flex-wrap:wrap}
.m-body{display:flex;flex-direction:column;gap:12px}
.copybox{min-height:220px;direction:rtl;font-family:var(--font-body)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:90vw}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 0;text-align:center}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.ed-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.ed-list div{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:8px;background:var(--sunk)}
.ed-list div span{flex:1}
.x{border:0;background:none;color:var(--absent);cursor:pointer;font-weight:700;padding:4px 8px;border-radius:6px}

@media (max-width:720px){
  h1{font-size:1.4rem}
  .hero{grid-template-columns:1fr}
  .seg button{padding:6px 8px}
  .radio-cards{grid-template-columns:1fr}
  .nav{width:100%;justify-content:space-between}
}
@media (max-width:420px){
  .stu{flex-wrap:wrap}
  .seg{width:100%}
  .seg button{flex:1}
}
/* subscriber gate */
.sub-gate[hidden]{display:none}.sub-gate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:var(--bg)}.sub-card{width:min(100%,480px);padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.sub-card h1{font-size:24px;margin:0 0 8px}.sub-card p{line-height:1.8;color:var(--muted)}.sub-card label{display:block;font-weight:600;margin:20px 0 8px}.sub-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}.sub-card button{margin-top:14px;width:100%}.sub-error{color:var(--absent)!important;font-size:13px;min-height:20px}</style>
</head>
<body>
<div class="sub-gate" id="subscriber-gate" hidden><section class="sub-card"><h1 id="subscriber-gate-title">رصد غياب الطلبة للمشتركين</h1><p id="subscriber-gate-message">جارٍ التحقق من تسجيل الدخول والاشتراك...</p><div class="row"><a class="btn primary" id="subscriber-login" href="../enjazy/auth.html?mode=login&return=%2Fghiyab-site%2Findex.html" hidden>تسجيل الدخول</a><a class="btn" id="subscriber-subscribe" href="../t.html#subscription-section-title" hidden>الاشتراك</a><button class="btn" id="subscriber-retry" type="button" hidden>إعادة المحاولة</button></div><p class="sub-error" id="subscriber-error"></p></section></div><header class="topbar"><div class="topbar-in" id="hdr"></div></header>
<div class="banner" id="banner" hidden></div>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem("gh_" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("gh_" + k, JSON.stringify(v)); }catch(e){} }
};
const ss = {
  get(k){ try{ return sessionStorage.getItem("gh_" + k); }catch(e){ return null; } },
  set(k, v){ try{ if(v == null) sessionStorage.removeItem("gh_" + k); else sessionStorage.setItem("gh_" + k, v); }catch(e){} }
};
function todayStr(d = new Date()){ const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate() + n); return todayStr(d); }
function daysBetween(a, b){ return Math.round((parseD(b) - parseD(a)) / 864e5); }
function fmtDate(s){ try{ return parseD(s).toLocaleDateString("ar-u-nu-latn", {weekday:"long", day:"numeric", month:"long", year:"numeric"}); }catch(e){ return s; } }
function fmtShort(s){ try{ return parseD(s).toLocaleDateString("ar-u-nu-latn", {day:"numeric", month:"numeric"}); }catch(e){ return s; } }
function hijri(s){ try{ return parseD(s).toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn", {day:"numeric", month:"long", year:"numeric"}); }catch(e){ return ""; } }
function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString("ar-u-nu-latn", {hour:"numeric", minute:"2-digit"}); }catch(e){ return ""; } }

const Local = {

  all(){ if(this.mem) return this.mem; try{ this.mem = JSON.parse(localStorage.getItem(this.key) || "{}"); }catch(e){ this.mem = {}; } return this.mem; },
  persist(){ try{ localStorage.setItem(this.key, JSON.stringify(this.mem)); }catch(e){} setTimeout(() => this.notify(), 0); },
  async get(p){ const v = this.all()[p]; return v ? clone(v) : null; },
  async set(p, d){ this.all()[p] = clone(d); this.persist(); },
  async merge(p, d){ const a = this.all(); a[p] = deepMerge(a[p] ? clone(a[p]) : {}, clone(d)); this.persist(); },
  async del(p){ delete this.all()[p]; this.persist(); },
  async list(col, filters = []){
    const a = this.all();

      .map(k => Object.assign({id: k.split("/")[1]}, clone(a[k])))

  subscribe(col, filters, cb){ const s = {col, filters, cb}; this.subs.push(s); this.list(col, filters).then(cb); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  watchDoc(p, cb){ const s = {doc: p, cb}; this.subs.push(s); this.get(p).then(cb); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  notify(){ for(const s of this.subs){ if(s.doc) this.get(s.doc).then(s.cb); else this.list(s.col, s.filters).then(s.cb); } },
  async batch(ops){ const a = this.all(); for(const o of ops){ if(o.op === "set") a[o.path] = clone(o.data); else if(o.op === "merge") a[o.path] = deepMerge(a[o.path] ? clone(a[o.path]) : {}, clone(o.data)); else if(o.op === "del") delete a[o.path]; } this.persist(); }

async function retry(fn){
  for(let i = 0; ; i++){
    try{ return await fn(); }
    catch(e){
      const c = e && e.code;
      if(i < 3 && (c === "unavailable" || c === "resource_exhausted")){ await sleep(500 + Math.random() * 700 * (i + 1)); continue; }
      throw e;
    }
  }
}

  db: null,
  async get(p){ const s = await retry(() => this.db.doc(p).get()); return s.exists ? clone(s.data()) : null; },
  async set(p, d){ await retry(() => this.db.doc(p).set(d)); },
  async merge(p, d){ const ref = this.db.doc(p); const s = await retry(() => ref.get()); if(s.exists) await retry(() => ref.update(d)); else await retry(() => ref.set(d)); },
  async del(p){ await retry(() => this.db.doc(p).delete()); },
  q(col, filters){ let q = this.db.collection(col); for(const f of filters) q = q.where(f[0], f[1], f[2]); return q; },
  async list(col, filters = []){ const s = await retry(() => this.q(col, filters).limit(1000).get()); return s.docs.map(d => Object.assign({id: d.id}, clone(d.data()))); },
  subscribe(col, filters, cb, onErr){ return this.q(col, filters).limit(1000).onSnapshot(s => cb(s.docs.map(d => Object.assign({id: d.id}, d.data())), s.metadata), e => onErr && onErr(e)); },
  watchDoc(p, cb, onErr){ return this.db.doc(p).onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), e => onErr && onErr(e)); },
  async batch(ops){ await runPool(ops, o => o.op === "set" ? this.set(o.path, o.data) : o.op === "merge" ? this.merge(o.path, o.data) : this.del(o.path), 4); }

const Api = {
  url: "", token: "", subscriber: "", subs: [], timer: null, pokeT: null, busy: false, again: false, failed: 0,
  async call(op, args = {}){
    let r;
    try{ r = await fetch(this.url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({op, token: this.token, subscriber: this.subscriber}, args)), redirect: "follow"}); }
    catch(e){ throw {code: "unavailable", message: "تعذّر الاتصال بخادم Google. تحقق من الإنترنت ومن رابط الخادم في config.js."}; }
    let j; try{ j = await r.json(); }catch(e){ throw {code: "server", message: "ردّ غير صالح من الخادم. تأكد أن Apps Script منشور كتطبيق ويب متاح لـ «أي شخص»."}; }
    if(!j.ok) throw {code: j.code || "server", message: j.error || "خطأ في الخادم"};
    return j.data;
  },
  get(p){ return retry(() => this.call("get", {path: p})); },
  async set(p, d){ await retry(() => this.call("set", {path: p, data: d})); this.poke(); },
  async merge(p, d){ await retry(() => this.call("merge", {path: p, data: d})); this.poke(); },
  async del(p){ await retry(() => this.call("del", {path: p})); this.poke(); },
  list(col, filters = []){ return retry(() => this.call("list", {col, filters})); },
  async batch(ops){ for(let i = 0; i < ops.length; i += 150){ const part = ops.slice(i, i + 150); await retry(() => this.call("batch", {ops: part})); } this.poke(); },
  subscribe(col, filters, cb, onErr){ const s = {col, filters, cb, onErr}; this.subs.push(s); this.poke(); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  watchDoc(p, cb, onErr){ const s = {doc: p, cb, onErr}; this.subs.push(s); this.poke(); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  poke(){ clearTimeout(this.pokeT); this.pokeT = setTimeout(() => this.poll(), 60); },
  async poll(){
    if(this.busy){ this.again = true; return; }
    this.busy = true; clearTimeout(this.timer);
    const subs = this.subs.slice();
    try{
      if(subs.length){
        const res = await this.call("multi", {queries: subs.map(s => s.doc ? {doc: s.doc} : {col: s.col, filters: s.filters})});
        this.failed = 0;
        subs.forEach((s, i) => { if(!this.subs.includes(s)) return; const k = JSON.stringify(res[i]); if(k === s.last) return; s.last = k; s.cb(res[i]); });
      }
    }catch(e){ this.failed++; if(this.failed === 2) toast(errMsg(e), 5000); }
    this.busy = false;
    if(this.again){ this.again = false; return this.poll(); }
    this.timer = setTimeout(() => this.poll(), document.hidden ? 120000 : 25000);
  }
};

async function listRange(from, to, extra = []){
  const rows = await Store.list("att", [["date", ">=", from], ["date", "<=", to], ...extra]);
  if(rows.length >= 1000 && from < to){
    const mid = addDays(from, Math.floor(daysBetween(from, to) / 2));
    const a = await listRange(from, mid, extra), b = await listRange(addDays(mid, 1), to, extra);
    return a.concat(b);
  }
  return rows;
}
async function runPool(items, fn, n = 4, onProg){
  let i = 0, done = 0; const errs = [];
  async function worker(){ while(i < items.length){ const it = items[i++]; try{ await retry(() => fn(it)); }catch(e){ errs.push(e); } done++; onProg && onProg(done, items.length); } }
  await Promise.all(Array.from({length: Math.min(n, items.length)}, worker));
  if(errs.length) throw errs[0];
}

  if(c === "revoked") return "لم يعد لديك وصول لهذه الصفحة.";

function dayStats(recs){
  const list = []; const submitted = new Set(); let enrolled = 0;
  for(const r of recs || []){
    const keys = Object.keys(r.periods || {}); if(!keys.length) continue;
    submitted.add(r.classId);
    const cls = clsById(r.classId);
    enrolled += cls ? cls.students.length : (r.periods[keys[0]].total || 0);
    const m = new Map();
    for(const k of keys.sort(arSort)){
      const p = r.periods[k];
      for(const [arr, key] of [[p.absent, "a"], [p.late, "l"], [p.excused, "e"]]) for(const s of arr || []){
        let o = m.get(s.id);
        if(!o){ o = {id: s.id, n: s.n, classId: r.classId, className: r.className, a: [], l: [], e: [], teachers: []}; m.set(s.id, o); }
        o[key].push(k); if(p.teacher && !o.teachers.includes(p.teacher)) o.teachers.push(p.teacher);
      }
    }
    for(const o of m.values()){ o.status = o.a.length ? "a" : o.e.length ? "e" : "l"; list.push(o); }
  }
  const cnt = v => list.filter(o => o.status === v).length;
  const a = cnt("a"), e = cnt("e"), l = cnt("l");
  return {list, submitted, total: S.classes.length, enrolled, a, e, l, rate: enrolled ? (1 - (a + e) / enrolled) * 100 : null};
}
function aggregate(recs){
  const stu = new Map(), byDate = new Map(), byClass = new Map(), log = [];
  for(const r of recs){
    const keys = Object.keys(r.periods || {}); if(!keys.length) continue;
    const cls = clsById(r.classId);
    const total = cls ? cls.students.length : (r.periods[keys[0]].total || 0);
    let bc = byClass.get(r.classId); if(!bc){ bc = {id: r.classId, name: r.className, studentDays: 0, aDays: 0, eDays: 0, lDays: 0, dates: new Set()}; byClass.set(r.classId, bc); }
    bc.dates.add(r.date); bc.studentDays += total;
    let bd = byDate.get(r.date); if(!bd){ bd = {date: r.date, a: 0, e: 0, l: 0, classes: 0}; byDate.set(r.date, bd); }
    bd.classes++;
    const day = new Map();
    for(const k of keys){
      const p = r.periods[k];
      for(const [arr, key] of [[p.absent, "a"], [p.late, "l"], [p.excused, "e"]]) for(const s of arr || []){
        let o = day.get(s.id); if(!o){ o = {n: s.n, a: 0, l: 0, e: 0}; day.set(s.id, o); }
        o[key]++;
        log.push([r.date, r.className, periodLabel(k), s.n, statusLabel[key], p.teacher || ""]);
      }
    }
    for(const [id, o] of day){
      const st = o.a ? "a" : o.e ? "e" : "l";
      const key = r.classId + "|" + id;
      let x = stu.get(key);
      if(!x){ x = {id, classId: r.classId, n: o.n, className: r.className, aDays: [], eDays: [], lDays: [], aPeriods: 0, last: ""}; stu.set(key, x); }
      x[st + "Days"].push(r.date); x.aPeriods += o.a;
      if(st !== "l" && r.date > x.last) x.last = r.date;
      bd[st]++; bc[st + "Days"]++;
    }
  }
  return {stu: Array.from(stu.values()), byDate: Array.from(byDate.values()).sort((a, b) => a.date < b.date ? -1 : 1), byClass: Array.from(byClass.values()), log: log.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : arSort(a[1], b[1]))};
}

  paint(html);
  if(S.route === "teacher" && S.roster) applyRosterFilter();
}

async function teacherLinkRequest(action, fields = {}, workspace = teacherWorkspace()) {

function savedTeacherNames() {
  return Array.isArray(S.cfg?.teacherLinkNames) ? S.cfg.teacherLinkNames : [];
}

const specificTeacherHeaders = new Set([
  "اسم المعلم", "اسم المعلمة", "اسم المعلم الكامل", "اسم المعلمة الكامل", "اسم المعلم/المعلمة",
  "اسم المعلم / المعلمة", "teacher name"
].map(norm));
const teacherNameHeaders = new Set([...specificTeacherHeaders, ...[
  "أسماء المعلمين", "أسماء المعلمات", "الاسم", "الاسم الكامل", "الاسم الثلاثي",
  "الاسم الرباعي", "اسم الموظف", "full name", "name"
].map(norm)]);

function extractTeacherNames(rows) {
  let headerRow = -1, nameColumn = -1;
  for(let i = 0; i < Math.min(30, rows.length); i++){
    const normalized = rows[i].map(norm);
    const specific = normalized.findIndex(value => specificTeacherHeaders.has(value));
    if(specific >= 0){ headerRow = i; nameColumn = specific; break; }
    if(headerRow < 0){
      const candidate = normalized.findIndex(value => teacherNameHeaders.has(value));
      if(candidate >= 0){ headerRow = i; nameColumn = candidate; }
    }
  }
  if(headerRow < 0){
    const usedColumns = new Set();
    for(const row of rows) row.forEach((cell, index) => {
      if(String(cell ?? "").trim()) usedColumns.add(index);
    });
    if(usedColumns.size !== 1) throw Error("ضع عنوان «اسم المعلم» في رأس عمود الأسماء في الورقة الأولى.");
    [nameColumn] = usedColumns;
  }

  const names = new Set();
  let ignored = 0, repeated = 0;
  for(const row of rows.slice(headerRow + 1)){
    const raw = row[nameColumn];
    const name = typeof raw === "string" ? raw.normalize("NFKC").trim().replace(/\s+/g, " ") : "";
    if(raw == null || String(raw).trim() === "") continue;
    if(name.length < 3 || name.length > 100 || !/\p{L}/u.test(name) || teacherNameHeaders.has(norm(name))){ ignored++; continue; }
    if(names.has(name)){ repeated++; continue; }
    names.add(name);
  }
  if(!names.size) throw Error("لم يُعثر على أسماء معلمين في العمود المحدد.");
  if(names.size > 400) throw Error("الحد الأقصى 400 اسم. راجع قائمة المعلمين ثم أعد رفع الملف.");
  return {names: [...names], ignored, repeated};
}

async function readTeacherWorkbook(file) {
  if(!/\.(?:xlsx|xls)$/i.test(file.name)) throw Error("اختر ملف Excel بصيغة XLSX أو XLS.");
  if(file.size > 3 * 1024 * 1024) throw Error("حجم الملف أكبر من 3 ميغابايت. استخدم ملفًا يحتوي على قائمة الأسماء فقط.");
  if(!window.XLSX) throw Error("تعذّر تحميل قارئ Excel. تحقّق من الاتصال ثم أعد فتح الصفحة.");
  let sheet;
  try{
    const book = XLSX.read(await file.arrayBuffer(), {type: "array", sheets: 0, sheetRows: 1001, cellFormula: false});
    sheet = book.Sheets[book.SheetNames[0]];
  }catch{ throw Error("تعذّر فتح الملف. احفظه مجددًا بصيغة Excel ثم أعد المحاولة."); }
  if(!sheet?.["!ref"]) throw Error("الورقة الأولى في الملف فارغة.");
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  const fullRange = XLSX.utils.decode_range(sheet["!fullref"] || sheet["!ref"]);
  if(fullRange.e.r - fullRange.s.r >= 1000) throw Error("اختصر الورقة الأولى إلى 1000 صف أو أقل، ثم أعد رفعها.");
  range.e.c = Math.min(range.e.c, range.s.c + 49);
  return extractTeacherNames(XLSX.utils.sheet_to_json(sheet, {header: 1, range, defval: "", raw: true, blankrows: false}));
}

async function persistTeacherNames(names) {
  if(Store !== Local){
    await Store.merge("school/config", {teacherLinkNames: names});
    return;
  }
  const current = Local.all();
  const next = {...current, "school/config": {...current["school/config"], teacherLinkNames: names}};
  try{ localStorage.setItem(Local.key, JSON.stringify(next)); }
  catch{ throw Error("تعذّر حفظ أسماء المعلمين في هذا المتصفح."); }
  Local.mem = next;
  Local.notify();
}

function openTeacherImport() {
  if(!S.admin || !S.cfg) return;
  const workspace = teacherWorkspace();
  let names = [];
  let readVersion = 0;
  modal({
    title: "رفع أسماء المعلمين من Excel", ok: "حفظ قائمة المعلمين",
    body: `<label class="f">ملف المعلمين<input type="file" id="teacher-roster-file" accept=".xlsx,.xls">
      <span class="hint">ضع أسماء المعلمين في الورقة الأولى تحت عنوان «اسم المعلم». إذا كانت الورقة تحتوي على عمود أسماء فقط، يمكنك تركه بلا عنوان.</span></label>
      ${savedTeacherNames().length ? '<p class="hint">سيستبدل الحفظ قائمة المعلمين الحالية بالقائمة الجديدة.</p>' : ""}
      <p id="teacher-roster-status" class="small muted" role="status"></p><div id="teacher-roster-preview"></div>`,
    onOk: async () => {
      if(!S.admin || !S.cfg || teacherWorkspace() !== workspace || !names.length) return false;
      const file = $("#teacher-roster-file");
      if(file) file.disabled = true;
      try{
        await persistTeacherNames(names);
        if(S.cfg && teacherWorkspace() === workspace){
          S.cfg.teacherLinkNames = names;
          toast(`حُفظت أسماء ${names.length} معلمًا. استخدم القائمة عند إنشاء رابط جديد.`);
          render();
        }
      }finally{ if(file?.isConnected) file.disabled = false; }
    }
  });
  const input = $("#teacher-roster-file"), save = $("#m-ok");
  const status = $("#teacher-roster-status"), preview = $("#teacher-roster-preview");
  save.disabled = true;
  input.addEventListener("change", async () => {
    const file = input.files[0], version = ++readVersion;
    names = [];
    save.disabled = true;
    preview.replaceChildren();
    status.textContent = file ? "جارٍ قراءة ملف المعلمين…" : "";
    if(!file) return;
    try{
      const result = await readTeacherWorkbook(file);
      if(!input.isConnected || version !== readVersion) return;
      names = result.names;
      status.textContent = [
        `${names.length} اسم جاهز للحفظ.`,
        result.repeated ? `استُبعد ${result.repeated} اسم مكرر.` : "",
        result.ignored ? `تُرك ${result.ignored} حقل ليس اسمًا صالحًا.` : ""
      ].filter(Boolean).join(" ");
      preview.innerHTML = `<ol style="max-height:200px;overflow:auto;margin:0;padding-inline-start:26px">${names.map(name => `<li>${h(name)}</li>`).join("")}</ol>`;
      save.disabled = false;
    }catch(error){
      if(input.isConnected && version === readVersion) status.textContent = errMsg(error);
    }
  });
}

let syncingTeacherLinks = false;
async function syncTeacherLinks(announce = false) {
  if(syncingTeacherLinks || !S.admin || !S.cfg || location.protocol === "file:") return;
  syncingTeacherLinks = true;
  const workspace = teacherWorkspace();
  try{
    const {receipts} = await teacherLinkRequest("pending", {}, workspace);
    if(!S.admin || !S.cfg || teacherWorkspace() !== workspace) return;
    const ack = [];
    let count = 0, retained = 0;
    for(const {id, period, record, submittedAt} of receipts){
      if(!S.admin || !S.cfg || teacherWorkspace() !== workspace) return;
      const path = `att/${record.date}_${record.classId}`;
      const old = (await Store.get(path))?.periods?.[period];
      if(old?.teacherReceiptId === id){
        ack.push(id);
        continue;
      }
      if(old?.at && Date.parse(old.at) >= Date.parse(submittedAt)){
        ack.push(id);
        retained++;
        continue;
      }
      const submission = {...record.periods[period], at: submittedAt, teacherReceiptId: id};
      await Store.merge(path, {...record, periods: {[period]: submission}});
      if(Store === Local && JSON.parse(localStorage.getItem(Local.key) || "{}")[path]?.periods?.[period]?.teacherReceiptId !== id){
        throw Error("تعذّر حفظ الرصد في هذا المتصفح.");
      }
      ack.push(id);
      count++;
    }
    if(ack.length) await teacherLinkRequest("ack", {ids: ack}, workspace);
    if(count){
      const refreshReport = S.atab === "reports" && S.rep.data && !S.rep.loading;
      S.rep.data = null;
      S.alerts.data = null;
      if(refreshReport) void ACT.runReport();
      if(S.atab === "alerts" && !S.alerts.loading) void ACT.loadAlerts();
    }
    if(count || retained || announce || S.teacherSyncFailed){
      S.teacherSyncNote = [count ? `استُلم ${count} رصد من المعلمين.` : "لا يوجد رصد جديد.",
        retained ? `بقي ${retained} سجل أحدث في لوحة الإدارة.` : ""].filter(Boolean).join(" ");
      S.teacherSyncFailed = false;
      if(S.route === "admin") render();
      if(announce) toast(S.teacherSyncNote);
    }
  }catch(error){
    S.teacherSyncNote = error?.message || "تعذّر تحديث رصد المعلمين.";
    const showError = !S.teacherSyncFailed;
    S.teacherSyncFailed = true;
    if(showError && S.route === "admin") render();
    if(announce) toast(S.teacherSyncNote, 5000);
  }finally{
    syncingTeacherLinks = false;
  }
}

function barChart(points){
  if(!points.length) return "";
  const W = 640, H = 190, padL = 30, padB = 26, padT = 14;
  const max = Math.max(1, ...points.map(p => p.v));
  const n = points.length, gap = 4, bw = Math.max(3, (W - padL - 6) / n - gap);
  const y = v => H - padB - (v / max) * (H - padB - padT);
  const step = Math.ceil(n / 10);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="عدد الغائبين يومياً">
    <line x1="${padL}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <line x1="${padL}" x2="${W}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${padL - 6}" y="${y(max) + 4}" text-anchor="end">${max}</text><text x="${padL - 6}" y="${y(0) + 4}" text-anchor="end">0</text>
    ${points.map((p, i) => { const x = W - 4 - (i + 1) * (bw + gap) + gap; const last = i === n - 1;
      return `<rect x="${x}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(0) - y(p.v))}" rx="2" fill="var(--absent)" opacity="${last ? 1 : .55}"><title>${h(p.label)}: ${p.v}</title></rect>${(i % step === 0 || last) ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${h(p.short)}</text>` : ""}`; }).join("")}
  </svg></div>`;
}

async function loadRosterTab(url){
  const response = await fetch("/api/ghiyab-sheet", {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url})
  });
  const isCsv = /^text\/csv(?:\s*;|$)/i.test(response.headers.get("content-type") || "");
  if(!response.ok || !isCsv){
    const {error} = await response.json().catch(() => ({}));
    if(!error && (response.status === 404 || response.ok)){
      throw Error("خدمة الاستيراد غير متاحة في هذه النسخة. تواصل مع إدارة الموقع لتحديثها.");
    }

  return [{name: "Google Sheets", rows: parseDelimited(await response.text())}];
}

function classifyHeader(row){
  const r = {name: -1, cls: -1, sec: -1, id: -1, phone: -1};
  row.forEach((cell, i) => {
    const c = norm(cell); if(!c) return;
    if(/هاتف|جوال|موبايل|phone|mobile|واتس|تواصل|تلفون/.test(c)){ if(r.phone < 0) r.phone = i; return; }
    if(/اسم|name/.test(c) && !/ولي|parent|guardian|معلم|teacher|مدرس|مدرسه|school/.test(c)){ if(r.name < 0) r.name = i; return; }
    if(/شعبه|section/.test(c)){ if(r.sec < 0) r.sec = i; return; }
    if(/صف|class|grade|مستوي|مرحله/.test(c)){ if(r.cls < 0) r.cls = i; else if(r.sec < 0) r.sec = i; return; }
    if(/فصل/.test(c)){ if(r.cls < 0) r.cls = i; else if(r.sec < 0) r.sec = i; return; }
    if(/رقم|هويه|^id$|كود|code|اكاديمي/.test(c)){ if(r.id < 0) r.id = i; return; }
  });
  return r;
}
function detectSheet(rows){
  for(let i = 0; i < Math.min(15, rows.length); i++){ const c = classifyHeader(rows[i]); if(c.name >= 0) return Object.assign({hr: i}, c); }
  const ncol = Math.max(0, ...rows.slice(0, 40).map(r => r.length));
  let best = 0, bestScore = -1;
  for(let j = 0; j < ncol; j++){ const sc = rows.slice(0, 40).filter(r => { const v = String(r[j] || "").trim(); return v.length >= 5 && /\s/.test(v) && !/^\d+$/.test(v); }).length; if(sc > bestScore){ bestScore = sc; best = j; } }
  return {hr: -1, name: best, cls: -1, sec: -1, id: -1, phone: -1};
}
function setImport(sheets, label){
  sheets = sheets.map(s => ({name: String(s.name || "").trim() || "ورقة", rows: s.rows.filter(r => r.some(c => String(c).trim()))})).filter(s => s.rows.length);
  if(!sheets.length){ toast("الملف فارغ أو لا يحتوي جدولاً"); return; }
  sheets.forEach(s => s.det = detectSheet(s.rows));
  S.imp = {label, sheets, mode: sheets[0].det.cls >= 0 ? "column" : "sheets", over: {name: "auto", cls: "auto", sec: "auto", id: "auto", phone: "auto"}};
  render();
}
function gradeOf(name){ const g = String(name).replace(/[\s\-\/\\_|.]*[0-9٠-٩]+[\s)]*$/, "").replace(/[\s\-\/\\_|]+$/, "").trim(); return g || name; }
function buildClasses(){
  const I = S.imp; if(!I) return {classes: [], count: 0, skipped: 0};
  const map = new Map(); let skipped = 0, order = 0;
  const cell = (row, i) => i >= 0 ? String(row[i] ?? "").replace(/\s+/g, " ").trim() : "";
  for(const sh of I.sheets){
    const col = f => I.over[f] === "auto" ? sh.det[f] : Number(I.over[f]);
    const ci = {name: col("name"), cls: col("cls"), sec: col("sec"), id: col("id"), phone: col("phone")};
    if(ci.name < 0) continue;
    const hdrNorm = sh.det.hr >= 0 ? norm(sh.rows[sh.det.hr][ci.name]) : null;
    sh.rows.forEach((row, ri) => {
      if(ri <= sh.det.hr) return;
      const n = cell(row, ci.name);
      if(!n || /^[\d\s.\-]+$/.test(n) || norm(n) === hdrNorm) return;
      let cname, grade;
      if(I.mode === "column"){
        const c = cell(row, ci.cls), sc = cell(row, ci.sec);
        if(!c){ skipped++; return; }
        cname = sc ? `${c} / ${sc}` : c; grade = sc ? c : gradeOf(c);
      } else { cname = sh.name; grade = gradeOf(sh.name); }
      let k = map.get(cname);
      if(!k){ k = {id: "c" + strHash(norm(cname)), name: cname, grade, order: order++, students: [], ids: new Set()}; map.set(cname, k); }
      const rawId = cell(row, ci.id);
      let id = rawId ? "n" + rawId.replace(/\s/g, "") : "s" + strHash(norm(n));
      let j = 2; const base = id; while(k.ids.has(id)) id = base + "_" + j++;
      k.ids.add(id);
      const st = {id, n}; const p = cell(row, ci.phone); if(p) st.p = p;
      k.students.push(st);
    });
  }
  const classes = Array.from(map.values()).map(({ids, ...c}) => c);
  return {classes, count: classes.reduce((s, c) => s + c.students.length, 0), skipped};
}
function parseDelimited(text){
  text = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const first = text.split("\n")[0];
  const delim = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"' && cur === "") q = true;
    else if(ch === delim){ row.push(cur); cur = ""; }
    else if(ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const FN = ["محمد","أحمد","عبدالله","سعيد","خالد","راشد","سلطان","حمدان","منصور","يوسف","عمر","علي","حمد","سيف","ماجد","فيصل","مريم","فاطمة","عائشة","شما","موزة","حصة","نورة","سارة","ميثاء","آمنة","ريم","لطيفة","هند","روضة"];
const LN = ["الشامسي","الكعبي","المهيري","النعيمي","الظاهري","السويدي","المنصوري","الحمادي","البلوشي","الزعابي","المرزوقي","الكتبي","الهاشمي","العامري","الفلاسي","الطنيجي"];
function demoClasses(){
  const defs = [["السادس", 1], ["السادس", 2], ["السابع", 1], ["السابع", 2], ["الثامن", 1], ["التاسع", 1]];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  return defs.map(([g, s], ci) => {
    const name = `${g} / ${s}`; const n = 18 + Math.floor(rnd() * 7); const used = new Set(); const students = [];
    while(students.length < n){ const nm = `${FN[Math.floor(rnd() * FN.length)]} ${FN[Math.floor(rnd() * 16)]} ${LN[Math.floor(rnd() * LN.length)]}`; if(used.has(nm)) continue; used.add(nm); students.push({id: "s" + strHash(norm(nm)), n: nm, p: "05" + String(Math.floor(10000000 + rnd() * 89999999))}); }
    students.sort((a, b) => arSort(a.n, b.n));
    return {id: "c" + strHash(norm(name)), name, grade: g, order: ci, students};
  });
}
function demoRecords(classes, mode){
  const recs = []; let d = todayStr(), count = 0;
  const TN = ["أ. محمد السويدي", "أ. فاطمة الكعبي", "أ. خالد النعيمي", "أ. مريم الشامسي"];
  while(count < 10){
    d = addDays(d, -1); const wd = parseD(d).getDay(); if(wd === 0 || wd === 6) continue; count++;
    for(const c of classes){
      const pick = k => { const out = []; for(let i = 0; i < k; i++){ const s = c.students[Math.floor(Math.random() * Math.min(c.students.length, 9))]; if(!out.some(x => x.id === s.id)) out.push({id: s.id, n: s.n}); } return out; };
      const a = pick(Math.floor(Math.random() * 3.4)), l = pick(Math.floor(Math.random() * 2)).filter(x => !a.some(y => y.id === x.id));
      const e = Math.random() < .25 ? pick(1).filter(x => !a.some(y => y.id === x.id) && !l.some(y => y.id === x.id)) : [];
      recs.push({path: `att/${d}_${c.id}`, data: {date: d, classId: c.id, className: c.name, grade: c.grade, demo: true, periods: {[mode === "period" ? "1" : "0"]: {absent: a, late: l, excused: e, teacher: TN[Math.floor(Math.random() * TN.length)], at: parseD(d).toISOString(), total: c.students.length}}}});
    }
  }
  return recs;
}

async function saveClasses(classes, replace){
  const old = replace ? S.classes.filter(c => !classes.some(n => n.id === c.id)) : [];
  const ops = classes.map(c => ({op: "set", path: "classes/" + c.id, data: {name: c.name, grade: c.grade || "", order: c.order ?? 0, students: c.students}})).concat(old.map(c => ({op: "del", path: "classes/" + c.id})));
  const t = document.createElement("div"); t.textContent = `جارٍ حفظ ${classes.length} صف…`; $("#toast").appendChild(t);
  try{ await Store.batch(ops); } finally { t.remove(); }
}

const ACT = {

  copyTeacherLink(){ const url = $("#teacher-link-url")?.value; if(url) copyText(url); },

  async impSheet(t){
    if(S.sheetImport) return;

    const url = (input()?.value || "").trim();

    if(!url && !remote) return toast("ألصق رابط Google Sheets أولًا");

      return toast(sheetImportErrors.invalid_sheet_url);
    }
    if(where === "setup") S.setup.f.sheetUrl = url;
    else S.impUrl = url;
    const previous = S.imp;
    const stillCurrent = () => input()?.value.trim() === url && S.imp === previous;
    S.sheetImportError = null;
    S.sheetImport = {where};
    render();
    try{
      const sheets = remote ? await Api.call("readSheet", {url}) : await loadRosterTab(url);

        $("#im-url-" + where)?.focus({preventScroll: true});

  closeModal, logout(){ S.admin = false; ss.set("admin", null); location.hash = "#home"; render(); },

    R.loading = false; render();
  },
  repAll(){ S.rep.showAll = !S.rep.showAll; render(); },
  tsvReport(){ copyText(tsv(reportRows())); },
  xlsReport(){ const A = S.rep.data; exportXlsx(`تقرير الغياب ${S.rep.from} - ${S.rep.to}.xlsx`, [{name: "ملخص الطلاب", rows: reportRows()}, {name: "السجل التفصيلي", rows: [["التاريخ", "الصف", "الحصة", "الطالب", "الحالة", "المعلم"], ...A.log]}, {name: "الأيام", rows: [["التاريخ", "غائب", "بعذر", "متأخر", "صفوف مرصودة"], ...A.byDate.map(d => [d.date, d.a, d.e, d.l, d.classes])]}]); },
  async loadAlerts(){
    const A = S.alerts; A.loading = true; render();
    const th = Number(S.cfg.alertN) || 3, win = Number(S.cfg.alertDays) || 30, to = todayStr();
    try{
      const recs = await listRange(addDays(to, -(win - 1)), to);
      const agg = aggregate(recs);
      const classDates = new Map(); for(const r of recs){ if(!classDates.has(r.classId)) classDates.set(r.classId, []); classDates.get(r.classId).push(r.date); }
      for(const v of classDates.values()) v.sort().reverse();
      A.data = agg.stu.filter(x => x.aDays.length >= th).map(x => {

        return {id: x.id, classId: x.classId, n: x.n, className: x.className, days: x.aDays.length, e: x.eDays.length, last: x.last, streak};
      }).sort((a, b) => b.days - a.days || b.streak - a.streak);

  async stuHist(t){
    const cid = t.dataset.cid, id = t.dataset.id; const c = clsById(cid); const s = c && c.students.find(x => x.id === id);
    const name = s ? s.n : t.textContent.trim();
    modal({title: `سجل غياب ${h(name)}`, body: `<div class="center" style="padding:20px"><div class="spinner"></div></div>`, wide: true});
    try{
      const recs = await listRange(addDays(todayStr(), -179), todayStr(), [["classId", "==", cid]]);
      const rows = [];
      for(const r of recs) for(const [k, p] of Object.entries(r.periods || {})) for(const [arr, st] of [[p.absent, "a"], [p.excused, "e"], [p.late, "l"]]) if((arr || []).some(x => x.id === id)) rows.push({date: r.date, k, st, by: p.teacher || ""});
      rows.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : arSort(a.k, b.k));
      const days = st => new Set(rows.filter(r => r.st === st).map(r => r.date)).size;
      const body = `<p class="muted small">${h(c ? c.name : "")} · آخر 180 يوماً${s && s.p ? " · هاتف ولي الأمر: " + h(s.p) : ""}</p>
        <div class="row"><span class="pill a">أيام غياب ${days("a")}</span><span class="pill e">بعذر ${days("e")}</span><span class="pill l">تأخر ${days("l")}</span></div>
        ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th>${S.cfg.mode === "period" ? "<th>الحصة</th>" : ""}<th>الحالة</th><th>المعلم</th></tr></thead><tbody>${rows.map(r => `<tr><td>${h(fmtDate(r.date))}</td>${S.cfg.mode === "period" ? `<td>${periodLabel(r.k)}</td>` : ""}<td><span class="pill ${r.st}">${statusLabel[r.st]}</span></td><td class="small">${h(r.by)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">لا يوجد غياب أو تأخر مسجل.</div>`}`;
      const mb = $("#modal-root .m-body"); if(mb) mb.innerHTML = body;
    }catch(e){ const mb = $("#modal-root .m-body"); if(mb) mb.innerHTML = `<p>${h(errMsg(e))}</p>`; }
  },
  toggleImport(){ S.showImport = !S.showImport; S.impUrl = S.cfg.sheetUrl || ""; if(!S.showImport) S.imp = null; render(); },
  impSave(t){
    const r = buildClasses(); if(!r.classes.length) return;
    const removed = S.classes.filter(c => !r.classes.some(n => n.id === c.id)).length;
    modal({title: "تحديث قائمة الطلاب", body: `<p>سيتم حفظ <b>${r.classes.length}</b> صف و<b>${r.count}</b> طالب${removed ? `، وحذف ${removed} صف غير موجود في الملف` : ""}. سجلات الغياب السابقة تبقى كما هي.</p>`, ok: "حفظ",
      onOk: async () => { await saveClasses(r.classes, true); const url = S.impUrl; if(url != null && url !== (S.cfg.sheetUrl || "")) await Store.merge("school/config", {sheetUrl: url}); S.imp = null; S.showImport = false; toast("تم تحديث الطلاب"); render(); }});
  },
  editClass(t){
    const c = t.dataset.id ? clsById(t.dataset.id) : null;
    S.edit = {id: c ? c.id : "", name: c ? c.name : "", grade: c ? c.grade || "" : "", students: c ? clone(c.students) : []};
    modal({title: c ? `تعديل ${h(c.name)}` : "إضافة صف", wide: true, body: editorBody(), ok: "حفظ الصف",
      onOk: async () => {
        const E = S.edit; const name = ($("#ed-name").value || "").trim(); if(!name){ toast("اكتب اسم الصف"); return false; }
        const grade = ($("#ed-grade").value || "").trim() || gradeOf(name);
        const id = E.id || "c" + strHash(norm(name));
        if(!E.id && clsById(id)){ toast("يوجد صف بهذا الاسم"); return false; }
        const order = E.id ? (clsById(E.id).order ?? 0) : S.classes.length;
        await Store.set("classes/" + id, {name, grade, order, students: E.students});
        toast("تم حفظ الصف");
      }});
  },
  edAdd(){
    const n = ($("#ed-new").value || "").trim(); const p = ($("#ed-newp").value || "").trim(); if(!n) return;
    let id = "s" + strHash(norm(n)), j = 2; const b = id; while(S.edit.students.some(s => s.id === id)) id = b + "_" + j++;
    const st = {id, n}; if(p) st.p = p; S.edit.students.push(st);
    S.edit.name = $("#ed-name").value; S.edit.grade = $("#ed-grade").value;
    $("#modal-root .m-body").innerHTML = editorBody(); $("#ed-new").focus();
  },
  edDel(t){ S.edit.name = $("#ed-name").value; S.edit.grade = $("#ed-grade").value; S.edit.students = S.edit.students.filter(s => s.id !== t.dataset.id); $("#modal-root .m-body").innerHTML = editorBody(); },
  edDelClass(){
    const E = S.edit; const c = clsById(E.id); if(!c) return;
    modal({title: `حذف ${h(c.name)}`, danger: true, ok: "حذف الصف", body: `<p>سيُحذف الصف وقائمة طلابه. سجلات الغياب السابقة تبقى في التقارير.</p>`, onOk: async () => { await Store.del("classes/" + c.id); toast("تم حذف الصف"); }});
  },
  async saveSettings(){
    const f = S.sf;
    if(!f.name.trim()) return toast("اكتب اسم المدرسة");
    const upd = {name: f.name.trim(), year: f.year.trim(), mode: f.mode, periods: Math.max(1, Math.min(12, Number(f.periods) || 7)), alertN: Math.max(1, Number(f.alertN) || 3), alertDays: Math.max(7, Math.min(180, Number(f.alertDays) || 30)), cc: omanCountryCode, sheetUrl: f.sheetUrl || ""};
    if(f.pin) upd.pinHash = await pwHash("pin::" + f.pin); else if(f.pinOff) upd.pinHash = "";
    try{ await Store.merge("school/config", upd); Object.assign(S.cfg, upd); S.sf = null; S.alerts.data = null; toast("تم حفظ الإعدادات"); render(); }
    catch(e){ toast(errMsg(e), 4500); }
  },
  async changePw(){
    const f = S.sf;
    if(await pwHash(f.oldPw) !== S.cfg.adminHash) return toast("كلمة السر الحالية غير صحيحة");
    if(f.newPw.length < 4) return toast("كلمة السر الجديدة 4 أحرف على الأقل");
    if(f.newPw !== f.newPw2) return toast("كلمتا السر غير متطابقتين");
    try{ const hsh = await pwHash(f.newPw); await Store.merge("school/config", {adminHash: hsh}); S.cfg.adminHash = hsh; ss.set("admin", hsh); f.oldPw = f.newPw = f.newPw2 = ""; toast("تم تغيير كلمة السر"); render(); }
    catch(e){ toast(errMsg(e), 4500); }
  },
  purgeOld(){
    modal({title: "حذف السجلات القديمة", danger: true, ok: "حذف", body: `<label class="f">احذف كل السجلات قبل تاريخ<input type="date" id="pg-date" value="${addDays(todayStr(), -180)}" max="${todayStr()}"></label>`,
      onOk: async () => { const d = $("#pg-date").value; if(!d) return false; const recs = await listRange("2000-01-01", addDays(d, -1)); await deleteRecs(recs); }});
  },
  purgeAll(){
    modal({title: "حذف كل سجلات الغياب", danger: true, ok: "حذف نهائي", body: `<p>ستُحذف جميع سجلات الغياب والتأخر لكل الصفوف. تبقى الصفوف والطلاب والإعدادات. لا يمكن التراجع.</p><label class="f">اكتب «حذف» للتأكيد<input type="text" id="cf-txt"></label>`,
      onOk: async () => { if($("#cf-txt").value.trim() !== "حذف"){ toast("اكتب كلمة «حذف» للتأكيد"); return false; } const recs = await listRange("2000-01-01", "2100-12-31"); await deleteRecs(recs); if(S.cfg.demo){ await Store.merge("school/config", {demo: false}); S.cfg.demo = false; } }});
  },
  resetAll(){
    modal({title: "إعادة تأسيس النظام", danger: true, ok: "حذف كل شيء", body: `<p>سيُحذف كل شيء: الإعدادات، كلمة السر، الصفوف، الطلاب، وكل سجلات الغياب، ثم تعود الصفحة لشاشة التأسيس.</p><label class="f">كلمة سر المدير<input type="password" id="cf-pw"></label>`,
      onOk: async () => {
        if(await pwHash($("#cf-pw").value) !== S.cfg.adminHash){ toast("كلمة السر غير صحيحة"); return false; }
        const recs = await listRange("2000-01-01", "2100-12-31"); await deleteRecs(recs);
        if(S.classes.length) await Store.batch(S.classes.map(c => ({op: "del", path: "classes/" + c.id})));
        await Store.del("school/config");
        S.cfg = null; S.classes = []; S.admin = false; ss.set("admin", null); S.daySubDate = null; S.rep.data = null; S.alerts.data = null;
        location.hash = "#setup"; route();
      }});
  }
};
function editorBody(){
  const E = S.edit;
  return `<div class="grid2"><label class="f">اسم الصف<input type="text" id="ed-name" value="${h(E.name)}" placeholder="السابع / 2"></label><label class="f">المرحلة<input type="text" id="ed-grade" value="${h(E.grade)}" placeholder="السابع"></label></div>
  <div class="row"><input type="text" id="ed-new" placeholder="اسم طالب جديد" class="grow" style="width:auto"><input type="tel" id="ed-newp" placeholder="هاتف ولي الأمر" style="width:170px"><button class="btn sm" data-act="edAdd">إضافة</button></div>
  <p class="small muted num">${E.students.length} طالب</p>
  <div class="ed-list">${E.students.map((s, i) => `<div><span class="num muted small">${i + 1}</span><span>${h(s.n)}</span><span class="small muted" style="flex:none">${h(s.p || "")}</span><button class="x" data-act="edDel" data-id="${h(s.id)}" aria-label="حذف ${h(s.n)}">×</button></div>`).join("") || `<p class="muted small">لا يوجد طلاب.</p>`}</div>
  ${E.id ? `<div><button class="btn sm danger" data-act="edDelClass">حذف هذا الصف</button></div>` : ""}`;
}
function reportRows(){
  const A = S.rep.data; if(!A) return [[]];
  return [["الطالب", "الصف", "أيام الغياب", "غياب بعذر", "تأخر", "حصص الغياب", "تواريخ الغياب"], ...A.stu.slice().sort((a, b) => (b.aDays.length + b.eDays.length) - (a.aDays.length + a.eDays.length) || arSort(a.n, b.n)).map(x => [x.n, x.className, x.aDays.length, x.eDays.length, x.lDays.length, x.aPeriods, x.aDays.concat(x.eDays).sort().join("، ")])];
}
async function deleteRecs(recs){
  const t = document.createElement("div"); $("#toast").appendChild(t);
  t.textContent = `جارٍ حذف ${recs.length} سجل…`;
  try{ if(recs.length) await Store.batch(recs.map(r => ({op: "del", path: "att/" + r.id}))); }
  finally{ t.remove(); }
  S.rep.data = null; S.alerts.data = null; toast(`تم حذف ${recs.length} سجل`);
}

/* ---------- binding & events ---------- */
function setPath(path, val){ const ks = path.split("."); let o = S; for(let i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) return; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const fn = ACT[t.dataset.act]; if(fn){ e.preventDefault(); fn(t, e); }
});
document.addEventListener("input", e => {
  const t = e.target; const b = t.dataset && t.dataset.bind; if(!b) return;
  if(t.type === "radio" || t.type === "checkbox" || t.tagName === "SELECT" || t.type === "date") return;
  setPath(b, t.value);
  if(b === "roster.q") applyRosterFilter();
  else if(b === "classQ" || b === "stuQ") render();
});
document.addEventListener("change", e => {
  const t = e.target;
  const b = t.dataset && t.dataset.bind; if(!b) return;
  if(t.type === "checkbox") setPath(b, t.checked);
  else if(t.type === "radio"){ if(t.checked) setPath(b, t.value); }
  else setPath(b, t.value);
  if(b === "date"){ if(!S.date) S.date = todayStr(); S.roster = null; S.done = null; ensureDaySub(); }
  if(b === "period"){ ls.set("period", S.period); S.roster = null; }
  if(t.type === "radio" || t.tagName === "SELECT" || b === "date" || b === "sf.sheetUrl") render();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if(e.key === "Enter" && e.target.tagName === "INPUT"){
    if(e.target.closest("#modal-root")){ if(e.target.id === "ed-new" || e.target.id === "ed-newp"){ e.preventDefault(); ACT.edAdd(); } else { const ok = $("#m-ok"); if(ok){ e.preventDefault(); ok.click(); } } }
    else if(e.target.id === "tl-name" || e.target.id === "tl-pin"){ e.preventDefault(); ACT.teacherLogin(); }
  }
});

/* ---------- routing ---------- */
function openAdminLogin(){
  modal({title: "دخول مدير النظام", body: `<label class="f">كلمة السر<input type="password" id="ad-pw" autocomplete="current-password"></label>`, ok: "دخول",
    onOk: async () => { if(await pwHash($("#ad-pw").value) !== S.cfg.adminHash){ toast("كلمة السر غير صحيحة"); return false; } S.admin = true; ss.set("admin", S.cfg.adminHash); S.route = "admin"; if(location.hash !== "#admin") location.hash = "#admin"; else route(); }});
}
function route(){
  let r = (location.hash || "").slice(1);
  if(!S.cfg) r = "setup"; else if(r === "setup") r = "home";
  if(!["setup", "home", "teacher", "admin"].includes(r)) r = "home";
  if(r === "admin" && !S.admin){ S.route = "home"; ensureDaySub(); render(); openAdminLogin(); return; }
  if(r !== S.route){ S.roster = null; S.done = null; }
  S.route = r;
  if(r === "admin" && S.atab === "alerts" && !S.alerts.data && !S.alerts.loading) ACT.loadAlerts();
  if(r === "admin") void syncTeacherLinks();
  ensureDaySub(); render();
}

/* ---------- boot ---------- */
async function getClaude(){ for(let i = 0; i < 25; i++){ if(window.claude && typeof window.claude.use === "function") return window.claude; await sleep(100); } return null; }
async function boot(teacherId){
  render();
  Local.key = "gh_store_v2:" + await sha("ghiyab-account::" + teacherId);
  const API = String(window.GHIYAB_API || "").trim();
  let cl = null;
  if(API){
    Api.url = API;
    Api.token = String(window.GHIYAB_TOKEN || "");
    Api.subscriber = ss.get("subscriber") || "";
    Store = Api;
    S.backend = "api";
    try{
      if(!Api.subscriber) throw Error("اطلب من مدير الخدمة تهيئة الوصول إلى خادم بيانات المدرسة.");
      await Api.call("activate", {license: Api.subscriber});
    }catch(e){
      S.fatal = errMsg(e);
      S.ready = true;
      render();
      return;
    }
  }
  else{
    cl = await getClaude();
    if(cl){
      const [db, dl] = await Promise.all([withTimeout(cl.use("db").catch(() => null), 11000), withTimeout(cl.use("downloads").catch(() => null), 11000)]);
      if(db){ Remote.db = db; Store = Remote; S.backend = "db"; }
      S.downloads = dl || null;
    }
  }
  S.inClaude = !!cl;
  try{
    S.cfg = await Store.get("school/config");
    S.classes = S.cfg ? sortClasses((await Store.list("classes")).map(c => Object.assign({students: []}, c))) : [];
  }catch(e){
    if(Store === Api){ S.fatal = errMsg(e); S.ready = true; render(); return; }
    if(Store === Remote){ Store = Local; S.backend = "local"; S.cfg = await Local.get("school/config"); S.classes = sortClasses(await Local.list("classes")); toast(errMsg(e), 5000); }
  }
  if(S.cfg && ss.get("admin") === S.cfg.adminHash) S.admin = true;
  S.ready = true;
  Store.watchDoc("school/config", cfg => {
    const had = !!S.cfg; S.cfg = cfg ? clone(cfg) : null;
    if(had !== !!S.cfg) route(); else render();
  }, () => {});
  Store.subscribe("classes", [], list => { S.classes = sortClasses(list.map(c => Object.assign({students: []}, c))); render(); }, e => toast(errMsg(e)));
  window.addEventListener("hashchange", route);
  route();
}
async function verifyPlatformSubscription(){
  const gate=document.getElementById('subscriber-gate');
  const message=document.getElementById('subscriber-gate-message');
  const login=document.getElementById('subscriber-login');
  const subscribe=document.getElementById('subscriber-subscribe');
  const retryButton=document.getElementById('subscriber-retry');
  const error=document.getElementById('subscriber-error');
  if(gate)gate.hidden=false;
  if(message)message.textContent='جارٍ التحقق من تسجيل الدخول والاشتراك...';
  [login,subscribe,retryButton].forEach(item=>{if(item)item.hidden=true;});
  if(error)error.textContent='';
  try{
    const response=await fetch('/api/subscriptions?action=board_access',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
    const data=await response.json().catch(()=>({}));
    if(response.ok && typeof data.teacher?.id === "string" && data.teacher.id){
      if(gate) gate.hidden = true;
      return data.teacher.id;
    }
    if(response.status===401){
      if(message)message.textContent='سجّل الدخول بحسابك في التحضير الذكي للوصول إلى رصد الغياب.';
      if(login)login.hidden=false;
    }else if(response.status===403){
      if(message)message.textContent='هذه الخدمة متاحة للمشتركين فقط. فعّل اشتراكًا ساريًا ثم أعد المحاولة.';
      if(subscribe)subscribe.hidden=false;
      if(retryButton)retryButton.hidden=false;
    }else{
      throw Error(data.error||'تعذر التحقق من الاشتراك.');
    }
  }catch(errorValue){
    if(message)message.textContent='تعذر الاتصال بخدمة التحقق من الاشتراك.';
    if(error)error.textContent=errorValue.message||'أعد المحاولة بعد التأكد من الاتصال.';
    if(retryButton)retryButton.hidden=false;
  }
  return false;
}
async function openForSubscriber(){
  const teacherId = await verifyPlatformSubscription();
  if(teacherId) await boot(teacherId);
}
document.getElementById("subscriber-retry")?.addEventListener("click", openForSubscriber);
openForSubscriber();
setInterval(() => {
  if(S.route === "admin" && !document.hidden) void syncTeacherLinks();
}, 30000);
</script>
</body>
