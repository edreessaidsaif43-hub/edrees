      return '<tr><td><b>' + esc(t.name) + '</b></td><td class="small">' + esc(t.subject) + '</td><td class="small" dir="ltr" style="text-align:right">' + esc(t.phone) + '</td><td class="num">' + r.lessons.filter(function (l) { return l.name === t.name; }).length + '</td><td class="num">' + r.blocks.filter(function (b) { return b.name === t.name; }).length + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn pri" data-a="ttApply" data-scope="' + scope + '">' + ic('check') + ' اعتماد هذا الجدول</button>' + (scope !== 'wz' && S.teachers.length ? '<label class="chk"><input type="checkbox" id="tt-replace"> استبدال الجدول بالكامل (حذف المعلمين غير الموجودين في الملف)</label>' : '') + '</div>'
      : '<div class="note err small" style="margin-top:10px">لم تُستخرج أي حصص صالحة. تأكد من استخدام النموذج.</div>') + '</div>';

ACT.ttApply = function (el) {

  toast('تم اعتماد الجدول: ' + res.lessons + ' حصة لـ ' + (res.created + res.updated) + ' معلمًا', 'ok');

/* ---------- 4. قواعد الاحتياط ---------- */
function wzRules() {

    '<label class="f">الحد الأقصى اليومي لحصص الاحتياط *<input type="number" min="1" max="6" value="' + st.defaultMaxDaily + '" data-c="setNum" data-k="defaultMaxDaily"></label>' +
    '<label class="f">الحد الأقصى الأسبوعي *<input type="number" min="1" max="30" value="' + st.defaultMaxWeekly + '" data-c="setNum" data-k="defaultMaxWeekly"></label>' +
    '<label class="f">أقصى حصص متتالية قبل تجنب الإسناد<input type="number" min="2" max="8" value="' + st.maxConsecutive + '" data-c="setNum" data-k="maxConsecutive"></label>' +
    '<label class="f">وضع التوزيع الافتراضي' + modeSelect() + '</label></div>' +
    '<div class="card" style="margin-top:14px;background:#fafcff"><h3>أوزان خوارزمية التوزيع الذكي (الافتراضية)</h3>' + Object.keys(E.DEFAULT_WEIGHTS).map(function (k) { return '<div class="row small" style="padding:3px 0;border-bottom:1px solid #f1f5f9"><span>' + E.WEIGHT_LABELS[k] + '</span><span class="sp"></span><b>' + st.weights[k] + '٪</b></div>'; }).join('') + '<div class="tiny muted" style="margin-top:6px">أوزان افتراضية قابلة للتعديل وليست قواعد وزارية معتمدة.</div></div>';
}

/* ---------- 5. المستخدمون ---------- */
function wzAccountProgress(status) {
  return '<div class="row"><b>' + status.ok + ' من ' + MANAGEMENT_ROLES.length + ' مكتمل</b><span class="sp"></span>' +
    (status.valid ? '<span class="badge b-green">✓ جاهز</span>' : '<span class="badge b-orange">غير مكتمل</span>') +
    '</div><div class="meter" style="height:8px;margin-top:6px"><i style="width:' + (100 * status.ok / MANAGEMENT_ROLES.length) + '%;background:' + (status.valid ? 'var(--green)' : 'var(--tq)') + '"></i></div>';
}
function wzUsers() {
  var users = wzState().users, status = usersStatus(users);

    '<div class="wz-progress" id="wz-account-progress">' + wzAccountProgress(status) + '</div>' +
    '<div class="stack" style="margin-top:12px">' + users.map(function (u, i) {
      var problem = draftUserProblem(u);
      return '<div class="wz-user ' + (problem ? '' : 'ok') + '"><div style="flex:1"><b>' + ROLES[u.role] + '</b>' +
        '<div class="form" style="margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">' +
        '<label class="f">الاسم<input type="text" value="' + esc(u.name) + '" data-c="wzU" data-i="' + i + '" data-k="name"></label>' +
        '<label class="f">رمز الدخول<input type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" value="' + esc(u.pin) + '" data-c="wzU" data-i="' + i + '" data-k="pin" placeholder="4–8 أرقام"></label>' +
        '</div><div class="tiny" data-account-problem style="color:var(--orange);margin-top:6px;min-height:1.5em">' +
        (u.name || u.pin ? problem || '' : '') + '</div></div></div>';
    }).join('') + '</div><p class="small" id="wz-account-duplicate" style="color:var(--red)"' + (status.dup ? '' : ' hidden') + '>استخدم اسمًا مختلفًا لكل حساب.</p>';
}

/* ---------- 6. المراجعة والتفعيل ---------- */
function wzReview() {
  var checks = wzChecks(), all = checks.every(function (c) { return c.ok; });
  return '<p class="muted small">راجع الإعدادات. يُفعَّل النظام عند اكتمال جميع البنود.</p><div class="stack">' + checks.map(function (c) {
    return '<div class="wz-check ' + (c.ok ? 'ok' : 'no') + '"><span class="n">' + (c.ok ? '✓' : '!') + '</span><div style="flex:1"><b>' + c.t + '</b><div class="small muted">' + esc(c.d) + '</div></div><button class="btn sm" data-a="wzGo" data-v="' + c.step + '">' + (c.ok ? 'تعديل' : 'إكمال') + '</button></div>';
  }).join('') + '</div>' +
    '<div class="row" style="margin-top:18px"><button class="btn pri lg" data-a="wzActivate"' + (all ? '' : ' disabled') + '>' + ic('check') + ' تفعيل النظام</button>' + (all ? '' : '<span class="small muted">أكمل البنود المعلّمة بعلامة (!) أولًا</span>') + '</div>';
}
ACT.wzActivate = function () {
  if (APP.activated) return;
  var checks = wzChecks();
  if (!checks.every(function (c) { return c.ok; })) { toast('أكمل جميع البنود أولًا', 'err'); return; }
  var W = wzState();
  APP.users = W.users.map(function (u) { return { id: u.id, name: u.name.trim(), role: u.role, pin: u.pin, schoolId: u.role === 'principal' ? S.id : null }; });

  S.log.unshift({ ts: Date.now(), user: 'معالج الإعداد', action: 'تفعيل النظام', details: S.teachers.length + ' معلمًا، وحسابا مدير النظام ومدير المدرسة' });

};

/* بدء الإعداد الفعلي من الوضع التجريبي */
ACT.startRealSetup = function () {
  confirmBox('بدء الإعداد الفعلي', 'ستُحذف البيانات التجريبية ويبدأ معالج الإعداد لمدرستك. يمكنك تنزيل نسخة احتياطية أولًا من «إعدادات المدرسة».', 'بدء الإعداد', true).then(function (ok) {
    if (!ok) return;

  });
};
/* ============================================================
   الأحداث والتشغيل
   ============================================================ */
var CHG = {
  setDate: function (el) { if (el.value) { UI.date = el.value; render(); } },
  setMode: function (el) { S.settings.mode = el.value; commit('تغيير وضع التوزيع', E.MODES[el.value]); },
  absQ: function (el) { UI.absQ = el.value; render(); },
  absPick: function (el) { if (el.checked) absSel[el.value] = 1; else delete absSel[el.value]; var c = $('.card .row .small.muted'); if (c) c.textContent = Object.keys(absSel).length + ' محدد'; },
  absType: function (el) { UI.absType = el.value; var p = $('#ab-periods'); if (p) p.classList.toggle('hidden', el.value !== 'partial'); },
  tSearch: function (el) { UI.tSearch = el.value; render(); },
  logQ: function (el) { UI.logQ = el.value; render(); },
  tStatus: function (el) { var t = E.teacherById(S, el.dataset.id); var old = teacherStatusLabel(t); t.status = el.value; commit('تغيير حالة معلم', t.name + ': ' + old + ' ← ' + teacherStatusLabel(t)); },
  ttTeacher: function (el) { UI.ttTeacher = el.value; render(); },
  ttClass: function (el) { UI.ttClass = el.value; render(); },
  repFrom: function (el) { UI.repFrom = el.value; render(); },
  repTo: function (el) { UI.repTo = el.value; render(); },
  switchSchool: function (el) { APP.currentSchoolId = el.value; pickSchool(); UI.date = defaultDate(); Store.save(); render(); },
  set: function (el) { S.settings[el.dataset.k] = el.value; commit('تعديل الإعدادات', el.dataset.k === 'msgTemplate' ? 'نموذج الرسالة' : el.dataset.k + ': ' + el.value); },
  setNum: function (el) {
    var v = Math.max(0, parseInt(el.value, 10) || 0);
    if (el.dataset.k === 'periods') v = Math.max(4, Math.min(10, v));
    S.settings[el.dataset.k] = v; commit('تعديل الإعدادات', el.dataset.k + ': ' + v);
  },
  dayToggle: function (el) {
    var d = +el.value, days = S.settings.days.slice();
    if (el.checked && days.indexOf(d) < 0) days.push(d);
    if (!el.checked) days = days.filter(function (x) { return x !== d; });
    if (!days.length) { toast('يجب اختيار يوم واحد على الأقل', 'err'); render(); return; }
    S.settings.days = days.sort(); commit('تعديل أيام الدوام', days.map(function (x) { return E.DAY_NAMES[x]; }).join('، '));
  },
  periodTimes: function (el) { S.settings.periodTimes = el.value.split(/[,،\s]+/).filter(Boolean); commit('تعديل مواعيد الحصص'); },
  weight: function (el) { var set = el.dataset.set; if (!S.settings[set]) S.settings[set] = Object.assign({}, E.DEFAULT_WEIGHTS); S.settings[set][el.dataset.k] = +el.value; commit('تعديل أوزان الخوارزمية', E.WEIGHT_LABELS[el.dataset.k] + ': ' + el.value + '٪'); },
  optToggle: function (el) { S.settings.opts[el.dataset.k] = el.checked; commit('تعديل خيارات التوزيع المخصص'); },
  logo: function (el) {
    var f = el.files[0]; if (!f) return;
    var school = S, img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      URL.revokeObjectURL(url);
      if (S !== school) return;
      var c = document.createElement('canvas'), m = 256, s = Math.min(1, m / Math.max(img.width, img.height));
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      school.settings.logo = c.toDataURL('image/png');
      commit('تحديث شعار المدرسة');
    };
    img.onerror = function () { URL.revokeObjectURL(url); if (S === school) toast('تعذرت قراءة الصورة', 'err'); };
    img.src = url;
  },
  restore: function (el) {
    var f = el.files[0]; if (!f) return;
    var workspace = APP;
    f.text().then(function (txt) {
      if (APP !== workspace) return;
      var obj = JSON.parse(txt);
      if (!Array.isArray(obj?.schools) || !Array.isArray(obj?.users)) throw new Error('ملف غير صالح');
      return confirmBox('استعادة نسخة احتياطية', 'ستُستبدل جميع البيانات الحالية بمحتوى النسخة (' + obj.schools.length + ' مدرسة، ' + obj.users.length + ' مستخدم).', 'استعادة', true).then(function (ok) {
        if (!ok || APP !== workspace) return;
        openWorkspace(obj, { session: ME?.id, currentSchoolId: S?.id });
        commit('استعادة نسخة احتياطية', f.name);
        toast('تمت الاستعادة', 'ok');
      });
    }).catch(function (e) { toast('تعذرت الاستعادة: ' + e.message, 'err'); });
  }
};
CHG.ttFile = function (el) { var f = el.files[0]; if (f) handleTTFile(f, el.dataset.scope); el.value = ''; };
CHG.wzU = function (el) {
  var users = wzState().users, u = users[+el.dataset.i], k = el.dataset.k;
  if (!u || (k !== 'name' && k !== 'pin')) return;
  u[k] = el.value.trim();
  var problem = draftUserProblem(u);
  var row = el.closest('.wz-user');
  row.classList.toggle('ok', !problem);
  $('[data-account-problem]', row).textContent = u.name || u.pin ? problem || '' : '';
  var status = usersStatus(users);
  $('#wz-account-progress').innerHTML = wzAccountProgress(status);
  $('#wz-account-duplicate').hidden = !status.dup;
  $('.wz-step[data-v="4"]').classList.toggle('done', status.valid);
  Store.save();
};

var LIVE = { absQ: 1, tSearch: 1, logQ: 1 }; // تحديث أثناء الكتابة

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || (!Store.hasAccess && el.dataset.a !== 'verifyAccess')) return;
  var fn = ACT[el.dataset.a];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', function (e) {
  if (!Store.hasAccess) return;
  var el = e.target.closest('[data-c]');
  if (!el || LIVE[el.dataset.c]) return;
  var fn = CHG[el.dataset.c]; if (fn) fn(el, e);
});
var liveTimer = null;
document.addEventListener('input', function (e) {
  if (!Store.hasAccess) return;
  var el = e.target.closest('[data-c]');
  if (!el || !LIVE[el.dataset.c]) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(function () {
    if (!el.isConnected) return;
    var key = el.dataset.c, pos = el.selectionStart;
    CHG[key](el);
    var n = $('[data-c="' + key + '"]');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } }
  }, 220);
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (Store.hasAccess && e.target.id === 'loginForm') doLogin();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && Modal.stack.length) Modal.stack[Modal.stack.length - 1](); });
window.addEventListener('hashchange', function () {
  if (!Store.hasAccess) return;
  var r = location.hash.slice(1);
  if (r && r !== UI.route && PAGES[r]) { UI.route = r; render(); }
});

(function boot() {
  var url = new URL(location.href);
  ['enjazyUserId', 'enjazyContact', 'enjazyName'].forEach(function (key) { url.searchParams.delete(key); });
  if (url.href !== location.href) {
    try { history.replaceState(history.state, '', url.href); } catch (error) { }
  }
  var hash = location.hash.slice(1);
  if (hash && PAGES[hash]) UI.route = hash;
  render();
  Store.start();
})();

if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
