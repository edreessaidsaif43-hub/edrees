<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2a4a">
<title>الاحتياط الذكي — إدارة حصص الاحتياط والتوزيع العادل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="description" content="الاحتياط الذكي — نظام إدارة حصص الاحتياط والتوزيع العادل بين المعلمين">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الاحتياط الذكي">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --navy:#0f2a4a; --navy2:#16365e; --navy3:#1f4878; --tq:#0d9488; --tq2:#14b8a6; --tq-l:#ccfbf1; --tq-xl:#f0fdfa;
  --bg:#f4f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1;
  --green:#16a34a; --yellow:#ca8a04; --orange:#ea580c; --red:#dc2626; --blue:#2563eb;
  --r:14px; --sh:0 1px 2px rgba(15,42,74,.06),0 4px 16px rgba(15,42,74,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--tq)}
.ic{width:18px;height:18px;flex:none;vertical-align:middle}
html,body{overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.35}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dbe7f5;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 16px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--tq2),var(--tq));display:grid;place-items:center;flex:none;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;color:#fff;font-size:16px}
.brand small{color:#8fb0d3;font-size:11.5px;display:block;line-height:1.4}
.nav{padding:10px 8px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#cfe0f2;text-decoration:none;margin:2px 0;font-size:14px;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--tq);color:#fff;font-weight:700}
.nav a .ic{width:20px;height:20px;flex:none;opacity:.9}
.nav a .cnt{margin-inline-start:auto;background:#f59e0b;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{padding:12px 14px;font-size:12px;color:#8fb0d3;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .slogan{color:var(--tq2);font-weight:700}
.portal-link{display:inline-block;color:var(--tq);font-size:13px;font-weight:700}
.login .portal-link,.side-foot .portal-link{margin-top:12px}
.side-foot .portal-link{color:var(--tq2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:19px;color:var(--navy)}
.top .sp{flex:1}
.menu-btn{display:none;background:none;border:0;padding:6px;cursor:pointer;color:var(--navy)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--tq-l);color:var(--tq);display:grid;place-items:center;font-weight:800}
.content{padding:20px 22px 60px;max-width:1400px;width:100%}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
.sync.on i{background:var(--green)} .sync.err i{background:var(--orange)}
.sync-toggle{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:start;padding:5px 3px}
.sync-toggle i{flex:none}
.login .sync{justify-content:center;margin-top:4px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 0 0 auto;width:270px;z-index:60;transform:translateX(100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55}
  .menu-btn{display:block}
  .top{padding:8px 12px}
  .top h1{font-size:16px}
  .content{padding:14px 12px 80px}
  .who .nm{display:none}
}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{font-size:15.5px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font-size:26px;color:var(--navy);display:block;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .bar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--tq)}
.kpi.warn .bar{background:var(--orange)} .kpi.bad .bar{background:var(--red)} .kpi.ok .bar{background:var(--green)}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.stack>*+*{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.nowrap{white-space:nowrap}
.center{text-align:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--navy);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f8fafc;border-color:#94a3b8}
.btn.pri{background:var(--tq);border-color:var(--tq);color:#fff}
.btn.pri:hover{background:#0f766e}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy3)}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:2px 7px;font-size:12px;border-radius:7px}
.btn.lg{padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.wa:hover{background:#1ebe5b}

input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],input[type=search],input[type=time],select,textarea{border:1px solid var(--line2);border-radius:9px;padding:7px 10px;background:#fff;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--tq);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13.5px}
.chk input{width:16px;height:16px;accent-color:var(--tq)}

.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:#f1f5f9;color:var(--navy);font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:#fafcff}
table.t tr.unc td{background:#fff7ed}
table.t tr.pin td{background:#f0fdfa}
table.t tr.sel td{background:#eff6ff!important;outline:2px dashed var(--blue)}
.num{font-variant-numeric:tabular-nums;text-align:center}

.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b-green{background:#dcfce7;color:#166534}.b-yellow{background:#fef9c3;color:#854d0e}.b-orange{background:#ffedd5;color:#9a3412}.b-red{background:#fee2e2;color:#991b1b}.b-gray{background:#f1f5f9;color:#475569}.b-blue{background:#dbeafe;color:#1e40af}.b-tq{background:var(--tq-l);color:#115e59}.b-navy{background:#e0e7ff;color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap;font-size:13.5px}
.tabs a.on{color:var(--tq);border-bottom-color:var(--tq)}
.seg{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg a{padding:5px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg a.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:6px}
.note{background:var(--tq-xl);border:1px solid var(--tq-l);border-radius:12px;padding:10px 14px;font-size:13px;color:#134e4a}
.note.warn{background:#fff7ed;border-color:#fed7aa;color:#7c2d12}
.note.err{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
.reason{font-size:12px;color:var(--muted);max-width:380px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:help}
.reason.open{-webkit-line-clamp:unset}

/* timetable grid */
.tt{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;min-width:640px}
.tt th{font-size:12px;color:var(--muted);font-weight:700;padding:4px}
.tt th.day{width:80px;text-align:right;color:var(--navy);font-size:13px}
.tt td{border-radius:9px;height:58px;padding:4px 6px;font-size:12px;vertical-align:top;cursor:pointer;line-height:1.35;border:1px solid transparent}
.tt td.free{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.tt td.les{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.tt td.blk{background:#fef3c7;border-color:#fde68a;color:#92400e}
.tt td.sub{background:#ccfbf1;border-color:#5eead4;color:#115e59}
.tt td.abs{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.tt td.na{background:#f8fafc;cursor:default}
.tt td b{display:block;font-size:12.5px}
.tt.ro td{cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{max-width:980px}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16.5px;color:var(--navy);flex:1}
.modal-b{padding:16px 18px;max-height:70vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media (max-width:640px){.modal-bg{padding:0;align-items:flex-end}.modal{border-radius:16px 16px 0 0}.modal-b{max-height:72vh}}

.toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13.5px;animation:pop .2s}
.toast.ok{background:#065f46}.toast.err{background:#991b1b}

/* candidate list */
.cand{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer}
.cand:hover{border-color:var(--tq);background:var(--tq-xl)}
.cand.on{border-color:var(--tq);background:var(--tq-xl);box-shadow:0 0 0 2px rgba(13,148,136,.2)}
.cand.no{opacity:.55;cursor:not-allowed;background:#f8fafc}
.cand .pr{width:46px;text-align:center;font-weight:800;color:var(--tq);font-size:15px}
.cand .bd{flex:1;min-width:0}
.meter{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--tq);border-radius:99px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 80% -10%,#1f4878 0,transparent 60%),linear-gradient(160deg,var(--navy),#0b1f37);padding:20px}
.login .box{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login .hero{text-align:center;margin-bottom:18px}
.login .hero .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 10px;background:linear-gradient(135deg,var(--tq2),var(--tq));display:grid;place-items:center}
.login h2{color:var(--navy);font-size:24px}
.login .slogan{color:var(--tq);font-weight:700;font-size:14px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit}
.gauge{display:flex;align-items:center;gap:14px}

.list-i{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;align-items:flex-start}
.list-i:last-child{border-bottom:0}
.act-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.act-card h4{font-size:14.5px;color:var(--navy)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);border-radius:99px;padding:3px 11px;font-size:12.5px;cursor:pointer;background:#fff}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wbar{display:flex;align-items:center;gap:10px}
.wbar input[type=range]{flex:1;accent-color:var(--tq)}
.wbar b{width:42px;text-align:center}
.printable{background:#fff;padding:24px;color:#0f172a;direction:rtl;font-family:'Cairo',sans-serif}
.printable .ph{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--tq);padding-bottom:10px;margin-bottom:14px}
.printable .ph img{width:56px;height:56px;object-fit:contain}
.printable h2{color:var(--navy);font-size:20px}
.printable table{width:100%;border-collapse:collapse;font-size:13px}
.printable th{background:var(--navy);color:#fff;padding:7px;border:1px solid var(--navy)}
.printable td{border:1px solid #cbd5e1;padding:6px 7px}
.printable tr:nth-child(even) td{background:#f8fafc}
.printable .pf{margin-top:18px;display:flex;justify-content:space-between;font-size:12.5px;color:#475569}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:#fafcff}
.drop:hover{border-color:var(--tq);color:var(--tq)}
code.k{font-family:inherit;background:#f1f5f9;border-radius:6px;padding:1px 6px;font-size:12.5px}

/* wizard */
.wz{min-height:100vh;background:var(--bg)}
.wz-top{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px}
.wz-top .brand{border:0}
.wz-top .sync{color:#8fb0d3}
.wz-body{display:grid;grid-template-columns:270px 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:22px 18px 60px}
.wz-steps{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;align-self:start}
.wz-step{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--ink);background:#fff;border:1px solid var(--line)}
.wz-step b{display:block;font-size:14px}.wz-step small{color:var(--muted);font-size:12px}
.wz-step .n,.wz-user .n,.wz-check .n,.wz-guide .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#e2e8f0;color:var(--navy);flex:none}
.wz-step.on{border-color:var(--tq);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.wz-step.on .n{background:var(--tq);color:#fff}
.wz-step.done .n{background:var(--green);color:#fff}
.wz-main{min-width:0}
.wz-h{font-size:20px;color:var(--navy);margin-bottom:10px}
.wz-foot{margin-top:14px}
.wz-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wz-card{border:1.5px solid var(--line2);border-radius:12px;padding:12px;cursor:pointer;background:#fff;color:var(--ink)}
.wz-card b{display:block}.wz-card small{color:var(--muted)}
.wz-card.on{border-color:var(--tq);background:var(--tq-xl);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.wz-chip{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;background:#fff}
.wz-guide{background:var(--tq-xl);border:1px solid var(--tq-l);border-radius:14px;padding:14px}
.wz-guide-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wz-guide-steps>div{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.wz-guide-steps small{color:var(--muted);font-size:12px}
.wz-guide a.btn{text-decoration:none}
.wz-guide .n{width:26px;height:26px;background:var(--tq);color:#fff}
.wz-list{margin:12px 0 18px;padding-inline-start:22px;line-height:2;font-size:14px}
.wz-progress{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wz-user{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.wz-user.ok{border-color:#86efac;background:#f0fdf4}
.wz-user.ok .n,.wz-check.ok .n{background:var(--green);color:#fff}
.wz-check{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.wz-check.no{border-color:#fdba74;background:#fff7ed}.wz-check.no .n{background:var(--orange);color:#fff}
.demo-bar{background:#fef3c7;border-bottom:1px solid #fde68a;color:#78350f;padding:8px 22px;display:flex;gap:10px;align-items:center;font-size:13.5px;flex-wrap:wrap}

</style></head><body><div id="root"></div><div id="toasts" class="toasts"></div><script src="store.js?v=7"></script><script>
/* ============================================================
   الاحتياط الذكي — محرك التوزيع العادل
   منطق خالص (بدون واجهة) يمكن اختباره في Node
   ============================================================ */
var Engine = (function () {
  'use strict';

  var DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var PERIOD_NAMES = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'];
  var COUNTED = { proposed: 1, approved: 1, done: 1 };      // تُحتسب في الخوارزمية
  var EXECUTED = { approved: 1, done: 1 };                   // تُحتسب في الرصيد الفعلي والتقارير
  var STATUS_LABEL = { proposed: 'مقترحة', approved: 'معتمدة', done: 'منفذة', cancelled: 'ملغاة', notdone: 'لم تُنفذ', uncovered: 'غير مغطاة' };

  var DEFAULT_WEIGHTS = { ratio: 35, week: 20, load: 15, todayTeach: 10, todaySubs: 10, recency: 5, duties: 5 };
  var WEIGHT_LABELS = {
    ratio: 'حصص الاحتياط السابقة مقارنة بفرص التوفر',
    week: 'إجمالي الاحتياط خلال الأسبوع الحالي',
    load: 'النصاب التدريسي الأسبوعي',
    todayTeach: 'عدد الحصص التدريسية في اليوم',
    todaySubs: 'عدد حصص الاحتياط في اليوم نفسه',
    recency: 'الفترة منذ آخر حصة احتياط',
    duties: 'المهام والأعباء الإضافية'
  };
  var MODES = {
    smart: 'التوزيع الذكي المتوازن',
    least: 'بحسب أقل عدد من حصص الاحتياط',
    load: 'بحسب النصاب التدريسي',
    subject: 'بحسب التخصص',
    manual: 'التوزيع اليدوي',
    custom: 'التوزيع المخصص حسب إعدادات المدرسة'
  };

  /* ---------------- أدوات التاريخ ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayIdx(s) { return parse(s).getDay(); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function weekStart(s) { return addDays(s, -dayIdx(s)); }      // الأحد
  function monthKey(s) { return s.slice(0, 7); }
  function today() { return fmt(new Date()); }
  function isSchoolDay(S, s) { return S.settings.days.indexOf(dayIdx(s)) >= 0; }
  function slotKey(d, p) { return d + '-' + p; }

  function uid(prefix) { return (prefix || 'x') + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

  /* ---------------- RNG قابل للبذر ---------------- */
  function rng(seed) {
    if (seed == null) return Math.random;
    var s = seed >>> 0 || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return (s % 1e9) / 1e9; };
  }

  /* ---------------- مساعدات البيانات ---------------- */
  function teacherById(S, id) { for (var i = 0; i < S.teachers.length; i++) if (S.teachers[i].id === id) return S.teachers[i]; return null; }
  function lesson(S, tid, d, p) { var t = S.schedule[tid]; return t ? t[slotKey(d, p)] || null : null; }
  function blocked(S, tid, d, p) { var t = teacherById(S, tid); return t && t.blocked ? t.blocked[slotKey(d, p)] || null : null; }
  function teachingCount(S, tid) { var t = S.schedule[tid]; return t ? Object.keys(t).length : 0; }
  function teachingOnDay(S, tid, d) { var n = 0; for (var p = 1; p <= S.settings.periods; p++) if (lesson(S, tid, d, p)) n++; return n; }
  function blockedCount(S, tid) { var t = teacherById(S, tid); return t && t.blocked ? Object.keys(t.blocked).length : 0; }
  function teacherClasses(S, tid) { var r = {}, t = S.schedule[tid] || {}; for (var k in t) r[t[k].cls] = 1; return r; }
  function allClasses(S) {
    var r = {};
    for (var tid in S.schedule) for (var k in S.schedule[tid]) r[S.schedule[tid][k].cls] = 1;
    return Object.keys(r).sort(clsSort);
  }
  function clsSort(a, b) {
    var pa = a.split('/'), pb = b.split('/');
    var na = parseInt(pa[0], 10), nb = parseInt(pb[0], 10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return a.localeCompare(b, 'ar');
  }

  function exemptionOn(t, date) {
    var e = t.exempt;
    if (!e || e.type === 'none' || !e.type) return null;
    if (e.from && date < e.from) return null;
    if (e.to && date > e.to) return null;
    return e;
  }
  function maxDaily(S, t) { return t.maxDaily != null && t.maxDaily !== '' ? +t.maxDaily : +S.settings.defaultMaxDaily; }
  function maxWeekly(S, t, date) {
    var m = t.maxWeekly != null && t.maxWeekly !== '' ? +t.maxWeekly : +S.settings.defaultMaxWeekly;
    var e = exemptionOn(t, date);
    if (e && e.type === 'partial' && e.maxWeekly != null && e.maxWeekly !== '') m = Math.min(m, +e.maxWeekly);
    return m;
  }

  /* فرص التوفر الأسبوعية: عدد حصص الفراغ الفعلية بعد خصم التدريس والمهام */
  function opportunities(S, t, date) {
    var total = S.settings.days.length * S.settings.periods;
    var free = Math.max(0, total - teachingCount(S, t.id) - blockedCount(S, t.id));
    var dl = +t.dutyLoad || 0;
    var opp = free * (1 - Math.min(0.5, dl * 0.05));
    var e = exemptionOn(t, date || today());
    if (e && e.type === 'full') return 0;
    if (e && e.type === 'partial') opp *= 0.5;
    if (t.status === 'exempt') return 0;
    if (t.active === false) return 0;
    return opp;
  }

  /* غياب معلم في تاريخ وحصة */
  function absenceFor(S, tid, date, p) {
    for (var i = 0; i < S.absences.length; i++) {
      var a = S.absences[i];
      if (a.teacherId !== tid || a.date !== date) continue;
      if (a.type === 'full' || (a.periods && a.periods.indexOf(p) >= 0)) return a;
    }
    return null;
  }

  /* ---------------- الحصص المطلوب تغطيتها ---------------- */
  function neededSlots(S, date) {
    var d = dayIdx(date), out = [], seen = {};
    S.absences.forEach(function (a) {
      if (a.date !== date) return;
      for (var p = 1; p <= S.settings.periods; p++) {
        if (a.type !== 'full' && (!a.periods || a.periods.indexOf(p) < 0)) continue;
        var l = lesson(S, a.teacherId, d, p);
        if (!l) continue;
        var key = a.teacherId + '|' + p;
        if (seen[key]) continue;
        seen[key] = 1;
        out.push({ key: key, date: date, period: p, cls: l.cls, subj: l.subj, absentId: a.teacherId });
      }
    });
    out.sort(function (x, y) { return x.period - y.period || clsSort(x.cls, y.cls); });
    return out;
  }

  /* ---------------- إحصاءات تاريخية ---------------- */
  function historyStats(S, opts) {
    // opts: {excludeDate, uptoDate, counted:true(alg)|false(executed only)}
    opts = opts || {};
    var set = opts.executedOnly ? EXECUTED : COUNTED;
    var st = {};
    S.teachers.forEach(function (t) {
      st[t.id] = { total: opts.from ? 0 : (+t.prevSubs || 0), byDate: {}, last: null, firstLast: 0 };
    });
    var P = S.settings.periods;
    S.assignments.forEach(function (a) {
      if (!a.subId || !set[a.status]) return;
      if (opts.excludeDate && a.date === opts.excludeDate) return;
      if (opts.from && a.date < opts.from) return;
      if (opts.to && a.date > opts.to) return;
      var s = st[a.subId]; if (!s) return;
      s.total++;
      s.byDate[a.date] = (s.byDate[a.date] || 0) + 1;
      if (!s.last || a.date > s.last) s.last = a.date;
      if (a.period === 1 || a.period === P) s.firstLast++;
    });
    return st;
  }
  function weekCount(stat, date) {
    var ws = weekStart(date), n = 0;
    for (var i = 0; i < 7; i++) n += stat.byDate[addDays(ws, i)] || 0;
    return n;
  }

  /* ---------------- سياق التخطيط ليوم ---------------- */
  function buildContext(S, date, kept) {
    var hist = historyStats(S, { excludeDate: date });
    var ctx = { S: S, date: date, d: dayIdx(date), hist: hist, today: {}, busy: {}, fl: {} };
    S.teachers.forEach(function (t) { ctx.today[t.id] = 0; ctx.busy[t.id] = {}; });
    (kept || []).forEach(function (a) { addToCtx(ctx, a.subId, a.period); });
    return ctx;
  }
  function addToCtx(ctx, tid, p) {
    if (!tid || ctx.today[tid] == null) return;
    ctx.today[tid]++; ctx.busy[tid][p] = 1;
  }
  function removeFromCtx(ctx, tid, p) {
    if (!tid || ctx.today[tid] == null) return;
    ctx.today[tid]--; delete ctx.busy[tid][p];
  }

  /* ---------------- القيود الإلزامية ---------------- */
  // تعيد null إن كان المعلم مؤهلًا، أو سبب الاستبعاد
  function hardCheck(ctx, t, slot, ignore) {
    var S = ctx.S, d = ctx.d, p = slot.period, date = ctx.date;
    ignore = ignore || {};
    if (t.active === false) return 'غير مفعّل';
    if (t.id === slot.absentId) return 'المعلم الغائب نفسه';
    if (t.status === 'absent') return 'غائب';
    if (t.status === 'permission') return 'مستأذن';
    if (t.status === 'exempt') return 'معفى';
    var e = exemptionOn(t, date);
    if (e && e.type === 'full') return 'معفى إعفاءً كليًا' + (e.reason ? ' (' + e.reason + ')' : '');
    if (absenceFor(S, t.id, date, p)) return 'غائب في هذه الحصة';
    if (lesson(S, t.id, d, p)) return 'لديه حصة تدريسية في الوقت نفسه';
    var b = blocked(S, t.id, d, p);
    if (b) return 'غير متاح: ' + b;
    if (ctx.busy[t.id][p] && !ignore.busy) return 'لديه حصة احتياط أخرى في الوقت نفسه';
    var todayN = ctx.today[t.id];
    if (!ignore.daily && todayN >= maxDaily(S, t)) return 'بلغ الحد الأقصى اليومي (' + maxDaily(S, t) + ')';
    var wk = weekCount(ctx.hist[t.id], date) + todayN;
    if (!ignore.weekly && wk >= maxWeekly(S, t, date)) return 'بلغ الحد الأقصى الأسبوعي (' + maxWeekly(S, t, date) + ')';
    return null;
  }

  function consecutiveRun(ctx, tid, p) {
    var S = ctx.S, d = ctx.d;
    function busyAt(q) { return q === p || !!lesson(S, tid, d, q) || !!blocked(S, tid, d, q) || !!ctx.busy[tid][q]; }
    var run = 1, q = p - 1;
    while (q >= 1 && busyAt(q)) { run++; q--; }
    q = p + 1;
    while (q <= S.settings.periods && busyAt(q)) { run++; q++; }
    return run;
  }

  /* ---------------- الأوزان حسب الوضع ---------------- */
  function profile(S, mode) {
    var st = S.settings;
    var opts = { specialty: true, classExp: true, consecutive: true, firstLast: true };
    var w;
    switch (mode) {
      case 'least': w = { total: 75, todaySubs: 15, week: 10 }; opts = { consecutive: true }; break;
      case 'load': w = { load: 55, ratio: 25, todaySubs: 10, week: 10 }; opts = { consecutive: true }; break;
      case 'subject': w = Object.assign({}, st.weights); opts.specialtyStrong = true; break;
      case 'custom': w = Object.assign({}, st.customWeights || st.weights); opts = Object.assign({}, st.opts); break;
      default: w = Object.assign({}, st.weights);
    }
    return { w: w, opts: opts };
  }

  /* ---------------- حساب الأولوية لمجموعة مرشحين ---------------- */
  function scoreCandidates(ctx, slot, cands, prof) {
    var S = ctx.S, P = S.settings.periods, date = ctx.date;
    var raw = cands.map(function (t) {
      var h = ctx.hist[t.id], todayN = ctx.today[t.id];
      var total = h.total + todayN;
      var opp = Math.max(1, opportunities(S, t, date));
      var lastGap = todayN > 0 ? 0 : (h.last ? diffDays(h.last, date) : 60);
      return {
        t: t,
        f: {
          ratio: total / opp,
          total: total,
          week: weekCount(h, date) + todayN,
          load: +t.load || teachingCount(S, t.id),
          todayTeach: teachingOnDay(S, t.id, ctx.d),
          todaySubs: todayN,
          recency: 1 / (1 + Math.max(0, lastGap)),
          duties: +t.dutyLoad || 0,
          firstLast: (slot.period === 1 || slot.period === P) ? h.firstLast : 0
        },
        run: consecutiveRun(ctx, t.id, slot.period),
        spec: t.subject && slot.subj && norm(t.subject) === norm(slot.subj),
        knowsCls: !!teacherClasses(S, t.id)[slot.cls],
        opp: opp
      };
    });
    var max = {};
    raw.forEach(function (r) { for (var k in r.f) max[k] = Math.max(max[k] || 0, r.f[k]); });
    var maxC = +S.settings.maxConsecutive || 4;
    raw.forEach(function (r) {
      var b = 0, parts = {};
      for (var k in prof.w) {
        var v = max[k] > 0 ? r.f[k] / max[k] : 0;
        parts[k] = v * prof.w[k];
        b += parts[k];
      }
      if (prof.opts.firstLast && max.firstLast > 0) { parts.firstLast = 8 * r.f.firstLast / max.firstLast; b += parts.firstLast; }
      if (prof.opts.consecutive && r.run > maxC) { parts.consecutive = 25 + 5 * (r.run - maxC); b += parts.consecutive; }
      if (prof.opts.specialty && r.spec) { parts.specialty = prof.opts.specialtyStrong ? -45 : -10; b += parts.specialty; }
      if (prof.opts.classExp && r.knowsCls) { parts.classExp = -5; b += parts.classExp; }
      r.burden = b; r.parts = parts;
      r.priority = Math.round(Math.max(0, Math.min(100, 100 - b)));
    });
    return raw;
  }
  function norm(s) { return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/\s+/g, '').replace(/^ال/, ''); }

  function pickBest(scored, rand) {
    var best = null, ties = [];
    scored.forEach(function (r) {
      if (!best || r.burden < best.burden - 1e-9) { best = r; ties = [r]; }
      else if (Math.abs(r.burden - best.burden) <= 1e-9) ties.push(r);
    });
    if (ties.length > 1) best = ties[Math.floor(rand() * ties.length)];
    best.tie = ties.length > 1;
    return best;
  }

  /* ---------------- تفسير سبب الاختيار ---------------- */
  function explain(ctx, chosen, scored, slot) {
    var S = ctx.S, t = chosen.t, bits = [];
    var avgTotal = 0, avgRatio = 0;
    scored.forEach(function (r) { avgTotal += r.f.total; avgRatio += r.f.ratio; });
    avgTotal /= scored.length; avgRatio /= scored.length;
    var title = honor(S, t);
    var oppTxt = ' مقابل ' + Math.round(chosen.opp) + ' فرصة توفر أسبوعيًا';
    if (chosen.f.ratio < avgRatio * 0.97) bits.push('نسبة احتياطه إلى فرص توفره منخفضة مقارنة بزملائه المتاحين (رصيده ' + chosen.f.total + oppTxt + '، ومتوسط زملائه ' + avgTotal.toFixed(1) + ')');
    else if (chosen.f.ratio <= avgRatio * 1.03) bits.push('نسبة احتياطه إلى فرص توفره قريبة من متوسط زملائه المتاحين (رصيده ' + chosen.f.total + oppTxt + ')');
    else bits.push('رصيده (' + chosen.f.total + oppTxt + ') أعلى من المتوسط لكنه الأنسب بين ' + scored.length + ' مرشحين بعد احتساب بقية المعايير');
    bits.push('لديه حصة فراغ ولا توجد مهام أخرى في هذا التوقيت');
    if (chosen.f.week === 0) bits.push('لم يُسند إليه احتياط هذا الأسبوع');
    else bits.push('احتياطه هذا الأسبوع ' + chosen.f.week);
    if (chosen.f.todaySubs === 0) bits.push('لا احتياط له اليوم');
    bits.push('لديه ' + chosen.f.todayTeach + ' حصص تدريسية اليوم');
    if (chosen.spec) bits.push('من نفس تخصص المادة');
    else if (chosen.knowsCls) bits.push('يدرّس هذا الصف ويعرف طلابه');
    if (chosen.tie) bits.push('تساوت معايير الأولوية مع زملاء آخرين فاختير عشوائيًا');
    return 'تم اختيار ' + title + ' ' + t.name + ' لأن ' + bits.join('، ') + '. (أولوية ' + chosen.priority + '٪ من ' + scored.length + ' مرشحين)';
  }
  function honor(S, t) {
    var g = S.settings.type === 'female' ? 'f' : S.settings.type === 'male' ? 'm' : (t.gender || 'm');
    return g === 'f' ? 'المعلمة' : 'المعلم';
  }

  /* ---------------- المرشحون لحصة ---------------- */
  function candidatesFor(ctx, slot, mode, ignore) {
    var ok = [], rejected = [];
    ctx.S.teachers.forEach(function (t) {
      var why = hardCheck(ctx, t, slot, ignore);
      if (why) rejected.push({ t: t, why: why }); else ok.push(t);
    });
    var scored = ok.length ? scoreCandidates(ctx, slot, ok, profile(ctx.S, mode)) : [];
    scored.sort(function (a, b) { return a.burden - b.burden; });
    return { scored: scored, rejected: rejected };
  }

  function summarizeRejections(rejected) {
    var c = {};
    rejected.forEach(function (r) { var k = r.why.replace(/ \(.*\)$/, '').replace(/^غير متاح: .*/, 'غير متاح (مهام/مناوبات)'); c[k] = (c[k] || 0) + 1; });
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).map(function (k) { return k + ': ' + c[k]; }).join('، ');
  }

  /* ============================================================
     التوزيع الجماعي — الخوارزمية الرئيسية
     1) نحتفظ بالحصص المثبتة (والمعتمدة إن طُلب)
     2) نرتب الحصص بحسب الأكثر تقييدًا (أقل عدد مرشحين) ونعيد الحساب بعد كل إسناد
     3) لكل حصة نختار أقل "عبء" مرجّح، والتعادل عشوائي
     4) إصلاح: للحصة غير المغطاة نبحث عن معلم أوقفه الحد الأقصى، وننقل إحدى
        حصصه غير المثبتة لمعلم آخر مؤهل، فنحرره لهذه الحصة (مسار تعزيز)
     ============================================================ */
  function distribute(S, date, mode, options) {
    options = options || {};
    var rand = rng(options.seed);
    mode = mode || S.settings.mode || 'smart';
    var slots = neededSlots(S, date);
    var existing = S.assignments.filter(function (a) { return a.date === date; });
    var byKey = {};
    existing.forEach(function (a) { byKey[a.key] = a; });

    var kept = [], result = [], log = [];
    slots.forEach(function (s) {
      var ex = byKey[s.key];
      var keep = ex && ex.subId && (ex.pinned || (options.keepApproved && (ex.status === 'approved' || ex.status === 'done')));
      if (keep) kept.push(ex);
    });
    var ctx = buildContext(S, date, kept);
    var keptKeys = {}; kept.forEach(function (a) { keptKeys[a.key] = 1; });
    var todo = slots.filter(function (s) { return !keptKeys[s.key]; });

    var assigned = {}; // key -> {slot, tid, reason, priority, manual}
    if (mode === 'manual') {
      todo.forEach(function (s) { assigned[s.key] = { slot: s, tid: null, reason: 'بانتظار الإسناد اليدوي' }; });
    } else {
      var remaining = todo.slice();
      while (remaining.length) {
        // الأكثر تقييدًا أولًا
        var bestIdx = -1, bestC = null, bestN = Infinity;
        for (var i = 0; i < remaining.length; i++) {
          var c = candidatesFor(ctx, remaining[i], mode);
          var n = c.scored.length;
          if (n < bestN || (n === bestN && remaining[i].period < remaining[bestIdx].period)) { bestN = n; bestIdx = i; bestC = c; }
          if (n === 0) break;
        }
        var slot = remaining.splice(bestIdx, 1)[0];
        if (bestN === 0) {
          assigned[slot.key] = { slot: slot, tid: null, rejected: bestC.rejected };
          continue;
        }
        var ch = pickBest(bestC.scored, rand);
        addToCtx(ctx, ch.t.id, slot.period);
        assigned[slot.key] = { slot: slot, tid: ch.t.id, reason: explain(ctx, ch, bestC.scored, slot), priority: ch.priority };
      }
      // تعظيم التغطية: إن بقيت حصص دون تغطية نعيد ترتيب الإسنادات جماعيًا
      var hasGap = todo.some(function (s) { return !assigned[s.key].tid; });
      if (hasGap) {
        var mx = maximize(S, date, todo, kept, assigned, mode);
        if (mx.gained > 0) {
          log.push('أعيد ترتيب ' + mx.changed.length + ' إسنادات لتغطية ' + mx.gained + ' حصص إضافية');
          // إعادة بناء السياق وتفسير الحصص المتغيرة
          var all = kept.slice();
          todo.forEach(function (s) { var tid = mx.owner[s.key]; if (tid) all.push({ subId: tid, period: s.period }); });
          mx.changed.forEach(function (k) {
            var s = assigned[k].slot, tid = mx.owner[k] || null;
            if (!tid) { assigned[k] = { slot: s, tid: null, rejected: [] }; return; }
            var others = all.filter(function (x) { return !(x.subId === tid && x.period === s.period); });
            var c2 = buildContext(S, date, others);
            var t = teacherById(S, tid);
            var opts2 = candidatesFor(c2, s, mode, { daily: true, weekly: true });
            var me = opts2.scored.filter(function (r) { return r.t.id === tid; })[0] || scoreCandidates(c2, s, [t], profile(S, mode))[0];
            assigned[k] = { slot: s, tid: tid, priority: me.priority, reason: explain(c2, me, opts2.scored.length ? opts2.scored : [me], s) + ' [حُددت ضمن إعادة الترتيب الجماعي لتحقيق أكبر تغطية ممكنة]' };
          });
        }
        // أسباب عدم التغطية بعد التعظيم
        var finalCtx = buildContext(S, date, kept.concat(todo.filter(function (s) { return assigned[s.key].tid; }).map(function (s) { return { subId: assigned[s.key].tid, period: s.period }; })));
        todo.forEach(function (s) {
          if (assigned[s.key].tid) return;
          var c3 = candidatesFor(finalCtx, s, mode);
          assigned[s.key].reason = 'تعذرت التغطية دون مخالفة القيود الإلزامية — ' + summarizeRejections(c3.rejected);
        });
      }
    }

    // بناء النتيجة
    slots.forEach(function (s) {
      var ex = byKey[s.key];
      if (keptKeys[s.key]) { result.push(Object.assign({}, ex)); return; }
      var a = assigned[s.key];
      result.push({
        id: ex ? ex.id : uid('a'), key: s.key, date: date, period: s.period, cls: s.cls, subj: s.subj,
        absentId: s.absentId, subId: a.tid, status: a.tid ? 'proposed' : 'uncovered',
        pinned: false, reason: a.reason, priority: a.priority || null, manual: false, mode: mode,
        activityId: ex ? ex.activityId || null : null, seen: false, ts: Date.now()
      });
    });
    var covered = result.filter(function (r) { return r.subId; }).length;
    return { date: date, mode: mode, assignments: result, total: slots.length, covered: covered, uncovered: slots.length - covered, notes: log };
  }

  /* ------------------------------------------------------------
     مرحلة التعظيم: مسارات تعزيز (تدفق أعظمي) تضمن أكبر تغطية ممكنة
     الشبكة: حصة → (معلم، حصة زمنية) سعة 1 → معلم سعة = المتبقي من حده
     ------------------------------------------------------------ */
  function maximize(S, date, todo, kept, assigned, mode) {
    var ctxK = buildContext(S, date, kept);
    var cap = {}, load = {}, tp = {}, owner = {}, elig = {}, mine = {};
    S.teachers.forEach(function (t) {
      var k = ctxK.today[t.id];
      cap[t.id] = Math.max(0, Math.min(maxDaily(S, t) - k, maxWeekly(S, t, date) - weekCount(ctxK.hist[t.id], date) - k));
      load[t.id] = 0; mine[t.id] = [];
    });
    var bySlot = {};
    todo.forEach(function (s) {
      bySlot[s.key] = s;
      var list = [];
      S.teachers.forEach(function (t) { if (!hardCheck(ctxK, t, s, { daily: true, weekly: true })) list.push(t.id); });
      // الأقل عبئًا أولًا للحفاظ على العدالة قدر الإمكان
      list.sort(function (a, b) { return (ctxK.hist[a].total + ctxK.today[a]) - (ctxK.hist[b].total + ctxK.today[b]); });
      elig[s.key] = list;
    });
    function put(sk, tid) { var p = bySlot[sk].period; tp[tid + '|' + p] = sk; load[tid]++; owner[sk] = tid; mine[tid].push(sk); }
    function take(sk) { var tid = owner[sk]; if (!tid) return; delete tp[tid + '|' + bySlot[sk].period]; load[tid]--; delete owner[sk]; mine[tid].splice(mine[tid].indexOf(sk), 1); }
    todo.forEach(function (s) { var a = assigned[s.key]; if (a && a.tid) put(s.key, a.tid); });
    var before = Object.keys(owner).length;
    var seenTP, seenS;
    function place(sk) {
      var s = bySlot[sk], cur = owner[sk], L = elig[sk];
      for (var i = 0; i < L.length; i++) {
        var tid = L[i]; if (tid === cur) continue;
        var node = tid + '|' + s.period;
        if (seenTP[node]) continue; seenTP[node] = 1;
        var occ = tp[node];
        if (occ) {
          if (seenS[occ]) continue; seenS[occ] = 1;
          if (place(occ)) { take(sk); put(sk, tid); return true; }
        } else if (load[tid] < cap[tid]) {
          take(sk); put(sk, tid); return true;
        } else {
          var ms = mine[tid].slice();
          for (var j = 0; j < ms.length; j++) {
            if (seenS[ms[j]]) continue; seenS[ms[j]] = 1;
            if (place(ms[j])) { take(sk); put(sk, tid); return true; }
          }
        }
      }
      return false;
    }
    todo.forEach(function (s) {
      if (owner[s.key]) return;
      seenTP = {}; seenS = {}; seenS[s.key] = 1;
      place(s.key);
    });
    var after = Object.keys(owner).length;
    var changed = [];
    todo.forEach(function (s) {
      var prev = assigned[s.key] ? assigned[s.key].tid : null;
      if ((owner[s.key] || null) !== prev) changed.push(s.key);
    });
    return { owner: owner, gained: after - before, changed: changed };
  }

  /* تطبيق نتيجة توزيع على حالة المدرسة */
  function applyPlan(S, plan) {
    S.assignments = S.assignments.filter(function (a) { return a.date !== plan.date; }).concat(plan.assignments);
  }

  /* ---------------- التحقق من القيود (لاختبارات وتعديل يدوي) ---------------- */
  function validateDay(S, date) {
    var errs = [], d = dayIdx(date);
    var list = S.assignments.filter(function (a) { return a.date === date && a.subId && COUNTED[a.status]; });
    var per = {};
    list.forEach(function (a) {
      var t = teacherById(S, a.subId);
      if (!t) { errs.push('معلم غير موجود'); return; }
      if (lesson(S, t.id, d, a.period)) errs.push(t.name + ': تعارض مع حصة تدريسية (ح' + a.period + ')');
      if (blocked(S, t.id, d, a.period)) errs.push(t.name + ': تعارض مع مهمة (ح' + a.period + ')');
      if (absenceFor(S, t.id, date, a.period)) errs.push(t.name + ': غائب ومُسند إليه احتياط');
      if (t.id === a.absentId) errs.push(t.name + ': أُسند للمعلم الغائب نفسه');
      var e = exemptionOn(t, date); if (e && e.type === 'full') errs.push(t.name + ': معفى كليًا');
      per[t.id] = per[t.id] || {};
      if (per[t.id][a.period]) errs.push(t.name + ': حصتان في الوقت نفسه (ح' + a.period + ')');
      per[t.id][a.period] = 1;
    });
    for (var tid in per) {
      var t = teacherById(S, tid), n = Object.keys(per[tid]).length;
      if (n > maxDaily(S, t)) errs.push(t.name + ': تجاوز الحد اليومي (' + n + ')');
      var h = historyStats(S, { excludeDate: date })[tid];
      if (weekCount(h, date) + n > maxWeekly(S, t, date)) errs.push(t.name + ': تجاوز الحد الأسبوعي');
    }
    return errs;
  }

  /* هل يمكن إسناد حصة لمعلم يدويًا؟ */
  function checkManual(S, date, assignment, tid) {
    var others = S.assignments.filter(function (a) { return a.date === date && a.id !== assignment.id && a.subId && COUNTED[a.status]; });
    var ctx = buildContext(S, date, others);
    var t = teacherById(S, tid);
    return hardCheck(ctx, t, { period: assignment.period, absentId: assignment.absentId, cls: assignment.cls, subj: assignment.subj });
  }
  function rankFor(S, date, assignment, mode) {
    var others = S.assignments.filter(function (a) { return a.date === date && a.id !== assignment.id && a.subId && COUNTED[a.status]; });
    var ctx = buildContext(S, date, others);
    var slot = { period: assignment.period, absentId: assignment.absentId, cls: assignment.cls, subj: assignment.subj };
    var c = candidatesFor(ctx, slot, mode || S.settings.mode);
    c.scored.forEach(function (r) { r.reason = explain(ctx, r, c.scored, slot); });
    return c;
  }

  /* ============================================================
     مؤشر العدالة
     العدالة = تناسب الاحتياط مع فرص التوفر (حصص الفراغ بعد خصم
     النصاب والمهام والإعفاءات)، وليس تساوي العدد
     ============================================================ */
  function fairness(S, range) {
    range = range || {};
    var hist = historyStats(S, { executedOnly: true, from: range.from, to: range.to });
    var refDate = range.to || today();
    var rows = [], sumOpp = 0, total = 0;
    S.teachers.forEach(function (t) {
      if (t.active === false) return;
      var opp = opportunities(S, t, refDate);
      var actual = hist[t.id].total;
      rows.push({ t: t, opp: opp, actual: actual, firstLast: hist[t.id].firstLast, last: hist[t.id].last });
      sumOpp += opp; total += actual;
    });
    var xs = [];
    rows.forEach(function (r) {
      r.expected = sumOpp > 0 ? total * r.opp / sumOpp : 0;
      if (r.opp <= 0) { r.index = null; r.level = 'exempt'; return; }
      r.index = r.expected > 0 ? Math.round(100 * r.actual / r.expected) : (r.actual > 0 ? 200 : 100);
      var diff = r.actual - r.expected;
      if (diff <= 1.5 || r.index <= 110) r.level = 'green';
      else if (r.index <= 130) r.level = 'yellow';
      else if (r.index <= 150) r.level = 'orange';
      else r.level = 'red';
      xs.push(r.actual / r.opp);
    });
    var sx = 0, sx2 = 0;
    xs.forEach(function (x) { sx += x; sx2 += x * x; });
    var jain = xs.length && sx2 > 0 ? (sx * sx) / (xs.length * sx2) : 1;
    return { rows: rows, total: total, overall: Math.round(jain * 100) };
  }
  var LEVELS = {

  var MALE = ['أحمد بن سالم البلوشي', 'محمد بن خلفان الحارثي', 'سعيد بن ناصر الهنائي', 'خالد بن حمد الريامي', 'يوسف بن علي الكندي', 'عبدالله بن سيف المعمري', 'سالم بن راشد الشكيلي', 'حمد بن عيسى الغافري', 'ناصر بن مبارك العامري', 'علي بن سعود الرواحي', 'مازن بن خميس السيابي', 'هلال بن سليمان الجابري', 'طارق بن عامر الوهيبي', 'فيصل بن ماجد اللواتي', 'بدر بن محمد الحبسي', 'عمر بن هلال البوسعيدي', 'إبراهيم بن زاهر الفارسي', 'وليد بن سالم المقبالي', 'سليمان بن حمود الشحي', 'منذر بن يعقوب الصوافي', 'هيثم بن جمعة الكلباني', 'زكريا بن مسعود العبري', 'أنور بن سعيد المحرزي', 'جمال بن عبدالله الراشدي', 'رائد بن سيف النعماني', 'قيس بن خالد البطاشي', 'مهند بن ناصر الحضرمي', 'عادل بن أحمد الشيدي', 'حسام بن علي القاسمي', 'نبيل بن حارب المنذري', 'صالح بن سالم الخروصي', 'ياسر بن حمد العلوي'];
  var FEMALE = ['فاطمة بنت سالم البلوشية', 'مريم بنت خلفان الحارثية', 'عائشة بنت ناصر الهنائية', 'زينب بنت حمد الريامية', 'خديجة بنت علي الكندية', 'شيخة بنت سيف المعمرية', 'أمل بنت راشد الشكيلية', 'نوال بنت عيسى الغافرية', 'هدى بنت مبارك العامرية', 'سميرة بنت سعود الرواحية', 'منى بنت خميس السيابية', 'ريا بنت سليمان الجابرية', 'بشرى بنت عامر الوهيبية', 'إيمان بنت ماجد اللواتية', 'أسماء بنت محمد الحبسية', 'عزة بنت هلال البوسعيدية', 'ليلى بنت زاهر الفارسية', 'وفاء بنت سالم المقبالية', 'سلمى بنت حمود الشحية', 'نجلاء بنت يعقوب الصوافية', 'هالة بنت جمعة الكلبانية', 'رحمة بنت مسعود العبرية', 'جميلة بنت سعيد المحرزية', 'ثريا بنت عبدالله الراشدية', 'بثينة بنت سيف النعمانية', 'كوثر بنت خالد البطاشية', 'منيرة بنت ناصر الحضرمية', 'غالية بنت أحمد الشيدية', 'حنان بنت علي القاسمية', 'نادية بنت حارب المنذرية', 'رقية بنت سالم الخروصية', 'سعاد بنت حمد العلوية'];

  /* ============================================================
     قراءة الجدول المدرسي من صفوف Excel
     يدعم ثلاثة تنسيقات:
     (أ) الشبكة: المعلم | التخصص | الهاتف | اليوم | الحصة 1 … الحصة ن
         الخلية: «7/2» أو «7/2 - رياضيات» أو «مناوبة» أو فارغة (فراغ)
     (ب) القائمة: المعلم | اليوم | الحصة | الصف | المادة
     (ج) الجدول الأسبوعي: صف لكل معلم، وعناوين الأيام فوق أرقام الحصص
     ============================================================ */
  var DUTY_WORDS = ['مناوبة', 'مناوبه', 'اجتماع', 'إشراف', 'اشراف', 'مهمة', 'مهمه', 'لجنة', 'لجنه', 'نشاط', 'غير متاح', 'مشغول', 'تنسيق', 'ريادة'];
  function cellStr(v) { return String(v == null ? '' : v).replace(/ /g, ' ').replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).trim(); }
  function normalizedDay(v) {
    return cellStr(v).replace(/[\u0640\u064B-\u065F\u0670]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/^يوم\s*/, '');
  }
  function parseDay(v, settings) {
    var s = normalizedDay(v);
    if (!s) return null;
    for (var i = 0; i < 7; i++) { var nm = normalizedDay(DAY_NAMES[i]); if (s === nm || s === nm.replace(/^ال/, '') || s.indexOf(nm) >= 0 || nm.indexOf(s) >= 0 && s.length >= 3) return i; }
    var n = parseInt(s, 10);
    if (!isNaN(n) && n >= 1 && n <= settings.days.length) return settings.days[n - 1];
    return null;
  }
  function parsePeriod(v) {
    var s = cellStr(v);
    var m = /(\d+)/.exec(s); if (m) return +m[1];
    for (var i = 0; i < PERIOD_NAMES.length; i++) if (s.indexOf(PERIOD_NAMES[i]) >= 0) return i + 1;
    return null;
  }
  function parseCell(v, defSubj) {
    var s = cellStr(v);
    if (!s || s === '-' || s === '—' || /^فراغ$/.test(s)) return null;
    for (var i = 0; i < DUTY_WORDS.length; i++) if (s.indexOf(DUTY_WORDS[i]) === 0 || s === DUTY_WORDS[i]) return { duty: s.replace(/^مهمة\s*[:：-]\s*/, '') || 'مهمة' };
    var parts = s.split(/\s*(?:\n|\r| - | – | — |\||،|,)\s*/).filter(Boolean);
    if (parts.length === 1) {
      var m = /^(\d{1,2}\s*[\/\\\-]\s*\d{1,2}|\d{1,2}\s*[أ-ي]|[^\s]+)\s+(.+)$/.exec(s);
      if (m && /\d/.test(m[1])) parts = [m[1], m[2]];
    }
    var cls = parts[0].replace(/\s+/g, '').replace(/\\/g, '/').replace(/^(\d{1,2})-(\d{1,2})$/, '$1/$2');
    return { cls: cls, subj: parts.slice(1).join(' ') || defSubj || '' };
  }
  function headerIndex(row, words) {
    for (var i = 0; i < row.length; i++) { var c = cellStr(row[i]); for (var j = 0; j < words.length; j++) if (c.indexOf(words[j]) >= 0) return i; }
    return -1;
  }
  function findWeeklyGrid(rows) {
    var days = DAY_NAMES.map(normalizedDay);
    for (var h = 0; h < Math.min(10, rows.length - 1); h++) {
      var headers = rows[h], periods = rows[h + 1];
      if (headerIndex(headers, ['المعلم', 'المعلمة', 'اسم']) < 0) continue;
      var day = -1, slots = [];
      for (var c = 0; c < periods.length; c++) {
        if (headers[c]) {
          var name = normalizedDay(headers[c]);
          day = days.findIndex(function (d) { return name === d || name === d.replace(/^ال/, ''); });
        }
        if (day < 0 || !periods[c]) continue;
        var period = /^(?:(?:الحصة|حصة|ح)\s*)?\d+$/.test(periods[c]) ||
          PERIOD_NAMES.some(function (n) { return periods[c] === n || periods[c] === 'الحصة ' + n; })
          ? parsePeriod(periods[c]) : null;
        if (period > 0) slots.push({ column: c, day: day, period: period });
      }
      if (new Set(slots.map(function (s) { return s.day; })).size >= 2) return { header: h, slots: slots };
    }
    return null;
  }
  function parseTimetable(rows, settings) {
    settings = settings || defaultSettings();
    var res = { format: null, teachers: [], lessons: [], blocks: [], errors: [], warnings: [] };
    rows = (rows || []).map(function (r) { return (r || []).map(cellStr); });
    var weekly = findWeeklyGrid(rows);
    var hi = weekly ? weekly.header : -1;
    if (!weekly) {
      for (var i = 0; i < Math.min(10, rows.length); i++) if (headerIndex(rows[i], ['المعلم', 'اسم']) >= 0 && headerIndex(rows[i], ['اليوم']) >= 0) { hi = i; break; }
    }
    if (hi < 0) { res.errors.push({ row: 0, msg: 'لم يُعثر على عناوين الجدول. استخدم نموذج Excel، أو ضع أسماء الأيام فوق أرقام الحصص.' }); return res; }
    var H = rows[hi];
    var iName = headerIndex(H, ['المعلم', 'اسم']), iDay = headerIndex(H, ['اليوم']);
    var iSubj = headerIndex(H, ['التخصص']), iPhone = headerIndex(H, ['الهاتف', 'الجوال', 'واتساب']);
    var iPer = headerIndex(H, ['الحصة', 'حصة']);
    var periodCols = [];
    H.forEach(function (h, idx) {
      if (idx === iName || idx === iDay || idx === iSubj || idx === iPhone) return;
      var p = /الحصة|حصة|^ح\s*\d|^\d+$/.test(h) || PERIOD_NAMES.some(function (n) { return h.indexOf(n) >= 0; }) ? parsePeriod(h) : null;
      if (p) periodCols.push({ idx: idx, p: p });
    });
    var tmap = Object.create(null);
    function teacher(name, subj, phone) {
      var t = tmap[name];
      if (!t) { t = tmap[name] = { name: name, subject: subj || '', phone: phone || '' }; res.teachers.push(t); }
      if (subj && !t.subject) t.subject = subj;
      if (phone && !t.phone) t.phone = phone;
      return t;
    }
    var seen = {}, clsSeen = {};
    function addLesson(rowNo, name, d, p, cls, subj) {
      var k = d + '-' + p;
      if (seen[name + '|' + k]) { res.errors.push({ row: rowNo, msg: name + ': أكثر من حصة في ' + DAY_NAMES[d] + ' الحصة ' + p }); return; }
      if (clsSeen[cls + '|' + k]) { res.errors.push({ row: rowNo, msg: 'تعارض: الصف ' + cls + ' مسجل مع ' + clsSeen[cls + '|' + k] + ' و' + name + ' في ' + DAY_NAMES[d] + ' الحصة ' + p }); return; }
      seen[name + '|' + k] = 1; clsSeen[cls + '|' + k] = name;
      res.lessons.push({ name: name, d: d, p: p, cls: cls, subj: subj });
    }
    function addBlock(rowNo, name, d, p, why) {
      var k = d + '-' + p;
      if (seen[name + '|' + k]) { res.errors.push({ row: rowNo, msg: name + ': تكرار في ' + DAY_NAMES[d] + ' الحصة ' + p }); return; }
      seen[name + '|' + k] = 1;
      res.blocks.push({ name: name, d: d, p: p, why: why });
    }
    function addCell(rowNo, t, day, period, value) {
      var cell = parseCell(value, t.subject);
      if (!cell) return;
      if (cell.duty) addBlock(rowNo, t.name, day, period, cell.duty);
      else addLesson(rowNo, t.name, day, period, cell.cls, cell.subj);
    }
    if (weekly) {
      res.format = 'weekly';
      var slots = weekly.slots.filter(function (slot) {
        if (slot.period <= PERIOD_NAMES.length) return true;
        res.warnings.push(DAY_NAMES[slot.day] + ': الحصة ' + slot.period + ' تتجاوز الحد المدعوم (' + PERIOD_NAMES.length + ') وتم تجاهلها');
        return false;
      });
      res.requiredPeriods = slots.reduce(function (max, slot) {
        return settings.days.indexOf(slot.day) >= 0 ? Math.max(max, slot.period) : max;
      }, settings.periods);
      for (var rw = hi + 2; rw < rows.length; rw++) {
        var weeklyRow = rows[rw], teacherName = weeklyRow[iName];
        if (!slots.some(function (slot) { return weeklyRow[slot.column]; })) continue;
        if (!teacherName) { res.errors.push({ row: rw + 1, msg: 'اسم المعلم فارغ' }); continue; }
        var weeklyTeacher = teacher(teacherName, weeklyRow[iSubj], weeklyRow[iPhone]);
        var excludedDays = new Set();
        slots.forEach(function (slot) {
          var value = weeklyRow[slot.column];
          if (!value) return;
          if (settings.days.indexOf(slot.day) < 0) { excludedDays.add(slot.day); return; }
          addCell(rw + 1, weeklyTeacher, slot.day, slot.period, value);
        });
        excludedDays.forEach(function (day) {
          res.errors.push({ row: rw + 1, msg: DAY_NAMES[day] + ' ليس من أيام الدوام في الإعدادات' });
        });
      }
    } else if (periodCols.length >= 2) {
      res.format = 'grid';
      var lastName = '', lastSubj = '', lastPhone = '';
      for (var r = hi + 1; r < rows.length; r++) {
        var row = rows[r]; if (!row.some(function (c) { return c; })) continue;
        var name = row[iName] || lastName;
        if (row[iName]) { lastName = row[iName]; lastSubj = iSubj >= 0 ? row[iSubj] : ''; lastPhone = iPhone >= 0 ? row[iPhone] : ''; }
        if (!name) { res.errors.push({ row: r + 1, msg: 'اسم المعلم فارغ' }); continue; }
        var subj = (iSubj >= 0 && row[iSubj]) || lastSubj, phone = (iPhone >= 0 && row[iPhone]) || lastPhone;
        var t = teacher(name, subj, phone);
        var d = parseDay(row[iDay], settings);
        if (d == null) { if (periodCols.some(function (pc) { return row[pc.idx]; })) res.errors.push({ row: r + 1, msg: 'يوم غير معروف: «' + row[iDay] + '»' }); continue; }
        if (settings.days.indexOf(d) < 0) { res.errors.push({ row: r + 1, msg: DAY_NAMES[d] + ' ليس من أيام الدوام في الإعدادات' }); continue; }
        periodCols.forEach(function (pc) {
          if (pc.p > settings.periods) { if (row[pc.idx]) res.warnings.push('الحصة ' + pc.p + ' تتجاوز عدد الحصص (' + settings.periods + ') وتم تجاهلها'); return; }
          addCell(r + 1, t, d, pc.p, row[pc.idx]);
        });
      }
    } else if (iPer >= 0) {
      res.format = 'list';
      var iCls = headerIndex(H, ['الصف', 'الفصل', 'الشعبة']), iSub2 = headerIndex(H, ['المادة']);
      if (iCls < 0) { res.errors.push({ row: hi + 1, msg: 'عمود «الصف» غير موجود' }); return res; }
      for (var r2 = hi + 1; r2 < rows.length; r2++) {
        var w = rows[r2]; if (!w.some(function (c) { return c; })) continue;
        var nm = w[iName]; if (!nm) { res.errors.push({ row: r2 + 1, msg: 'اسم المعلم فارغ' }); continue; }
        var t2 = teacher(nm, iSubj >= 0 ? w[iSubj] : '', iPhone >= 0 ? w[iPhone] : '');
        var d2 = parseDay(w[iDay], settings), p2 = parsePeriod(w[iPer]);
        if (d2 == null || settings.days.indexOf(d2) < 0) { res.errors.push({ row: r2 + 1, msg: 'يوم غير صالح: «' + w[iDay] + '»' }); continue; }
        if (!p2 || p2 > settings.periods) { res.errors.push({ row: r2 + 1, msg: 'رقم حصة غير صالح: «' + w[iPer] + '»' }); continue; }
        var c2 = parseCell(w[iCls] + (iSub2 >= 0 && w[iSub2] && !/^(مهمة|مناوبة)/.test(w[iCls]) ? ' - ' + w[iSub2] : ''), t2.subject);
        if (/^مهمة|^مناوبة/.test(w[iCls])) c2 = { duty: (iSub2 >= 0 && w[iSub2]) || w[iCls] };
        if (!c2) continue;
        if (c2.duty) addBlock(r2 + 1, nm, d2, p2, c2.duty); else addLesson(r2 + 1, nm, d2, p2, c2.cls, c2.subj);

    }

    res.teachers = res.teachers.filter(function (t) { return has[t.name]; });

    res.teachers.forEach(function (t) {
      if (t.subject) return;

      t.subject = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0] || '';

    return res;
  }

  /* تطبيق جدول مُحلَّل على المدرسة (استبدال جدول المعلمين الواردين فيه) */
  function applyTimetable(S, parsed, opts) {
    opts = opts || {};
    if (parsed.requiredPeriods > S.settings.periods) S.settings.periods = parsed.requiredPeriods;
    var byName = Object.create(null); S.teachers.forEach(function (t) { byName[t.name.trim()] = t; });
    var touched = {}, created = 0;
    if (opts.replaceAll) { S.teachers = []; S.schedule = {}; byName = Object.create(null); }
    parsed.teachers.forEach(function (pt) {
      var t = byName[pt.name];
      if (!t) {
        t = { id: uid('t'), name: pt.name, gender: S.settings.type === 'female' ? 'f' : 'm', subject: pt.subject, load: 0, phone: pt.phone, duties: [], dutyLoad: 0, maxDaily: '', maxWeekly: '', status: 'present', exempt: { type: 'none', reason: '', from: '', to: '', maxWeekly: '' }, prevSubs: 0, blocked: {}, active: true };
        S.teachers.push(t); byName[pt.name] = t; created++;
      } else { if (pt.subject) t.subject = pt.subject; if (pt.phone) t.phone = pt.phone; }
      S.schedule[t.id] = {}; t.blocked = {}; touched[t.id] = 1;
    });
    parsed.lessons.forEach(function (l) {
      var t = byName[l.name];
      S.schedule[t.id][slotKey(l.d, l.p)] = { cls: l.cls, subj: l.subj || t.subject || '' };
    });
    var dutyCount = {};
    parsed.blocks.forEach(function (b) { var t = byName[b.name]; t.blocked[slotKey(b.d, b.p)] = b.why; dutyCount[t.id] = (dutyCount[t.id] || 0) + 1; });
    S.teachers.forEach(function (t) { if (touched[t.id]) { t.load = teachingCount(S, t.id); } if (!S.schedule[t.id]) S.schedule[t.id] = {}; });
    return { created: created, updated: Object.keys(touched).length - created, lessons: parsed.lessons.length, blocks: parsed.blocks.length };
  }

  /* نموذج Excel للجدول بتنسيق الشبكة */
  function timetableTemplate(settings, sample) {
    var head = ['المعلم', 'التخصص', 'الهاتف', 'اليوم'];
    for (var p = 1; p <= settings.periods; p++) head.push('الحصة ' + p);

function newApp(demo) {
  var school = demo ? E.makeDemo({ seed: Math.floor(Math.random() * 1e6) }) : E.emptySchool('مدرستي');
  if (!demo) return { version: 2, schools: [school], users: [], updatedAt: Date.now(), session: null, currentSchoolId: school.id, activated: false, demo: false };
  var users = [
    { id: 'u-admin', name: 'مدير النظام', role: 'sysadmin', pin: '1234', schoolId: null },
    { id: E.uid('u'), name: 'مدير المدرسة', role: 'principal', pin: '1111', schoolId: school.id }
  ];
  return { version: 2, schools: [school], users: users, updatedAt: Date.now(), session: null, currentSchoolId: school.id, activated: true, demo: true };
}
function restrictAccounts(workspace) {
  var users = workspace.users;
  var ids = new Set();
  workspace.users = [];
  MANAGEMENT_ROLES.forEach(function (role) {
    var user = users.find(function (u) {
      return u && u.role === role && typeof u.id === 'string' && u.id && !ids.has(u.id)
        && typeof u.name === 'string' && u.name.trim() && String(u.pin ?? '').length >= 4;
    });
    if (!user) return;
    var school = role === 'principal'
      ? workspace.schools.find(function (s) { return s.id === user.schoolId; }) || workspace.schools[0] : null;
    ids.add(user.id);
    workspace.users.push({ id: user.id, name: user.name, role: role, pin: String(user.pin), schoolId: school?.id ?? null });
  });
  delete workspace.teacherPin;
  if (workspace.setup) {
    workspace.setup.users = managementDrafts(workspace.setup.users);
    delete workspace.setup.teacherPin;
  }
  if (workspace.activated && !workspace.users.length && workspace.schools.length) {
    workspace.activated = false;
    workspace.setup = { ...workspace.setup, step: 4, started: true, users: workspace.setup?.users ?? managementDrafts() };
  }
}


function pickSchool() {
  if (!APP) return;
  var id = ME && ME.schoolId ? ME.schoolId : APP.currentSchoolId;
  S = APP.schools.filter(function (s) { return s.id === id; })[0] || APP.schools[0] || null;
  if (S) {
    APP.currentSchoolId = S.id;
    // ترقية حقول ناقصة
    var def = E.defaultSettings();
    for (var k in def) if (S.settings[k] == null) S.settings[k] = def[k];
    ['requests', 'notifications', 'log', 'activities'].forEach(function (k) { if (!S[k]) S[k] = []; });
    if (!S.approvedDays) S.approvedDays = {};
  }
}
function commit(action, details, opts) {
  if (action && S) {
    S.log.unshift({ ts: Date.now(), user: ME ? ME.name + ' (' + ROLES[ME.role] + ')' : 'النظام', action: action, details: details || '' });
    if (S.log.length > 1500) S.log.length = 1500;
  }
  Store.save();
  if (!opts || opts.render !== false) render();
}

}

    bg.querySelector('[data-x]').onclick = close;

        if (r !== false) close();

    });
    Modal.stack.push(close);

    if (first && !o.noFocus) setTimeout(function () { try { first.focus(); } catch (e) { } }, 50);

function exportPDF(filename, html, landscape) {

function readTable(file) {
  // يعيد مصفوفة صفوف من Excel/CSV/PDF/نص
  var name = (file.name || '').toLowerCase();
  if (/\.(xlsx|xlsm)$/.test(name)) {
    return file.arrayBuffer().then(XL.read).then(function (sheets) {
      var pick = sheets.filter(function (s) { return /الجدول|جدول|المعلم/.test(s.name) && s.rows.length > 1; })[0] || sheets.filter(function (s) { return s.rows.length > 1; })[0] || sheets[0];
      return pick ? pick.rows : [];
    });
  }
  if (/\.(xls|ods)$/.test(name)) {
    return Promise.all([lib('xlsx'), file.arrayBuffer()]).then(function (r) {
      var wb = XLSX.read(r[1], { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    });
  }
  if (/\.pdf$/.test(name)) return readPdfTable(file);
  return file.text().then(parseDelimited);
}
function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
  var delim = lines[0] && lines[0].indexOf('\t') >= 0 ? '\t' : (lines[0] && lines[0].indexOf(';') >= 0 && lines[0].indexOf(',') < 0 ? ';' : ',');
  return lines.map(function (l) {
    if (delim !== ',') return l.split(delim).map(function (c) { return c.trim(); });
    var out = [], cur = '', q = false;
    for (var i = 0; i < l.length; i++) {
      var ch = l[i];
      if (ch === '"') { if (q && l[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === ',' && !q) { out.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function readPdfTable(file) {
  return Promise.all([lib('pdfjs'), file.arrayBuffer()]).then(function (r) {
    var pdfjsLib = window.pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfjs.replace('pdf.min.js', 'pdf.worker.min.js');
    return pdfjsLib.getDocument({ data: r[1], disableWorker: true, isEvalSupported: false }).promise;
  }).then(function (pdf) {
    var pages = [];
    for (var i = 1; i <= pdf.numPages; i++) pages.push(pdf.getPage(i).then(function (p) { return p.getTextContent(); }));
    return Promise.all(pages);
  }).then(function (contents) {
    var rows = [];
    contents.forEach(function (tc) {
      var items = tc.items.filter(function (it) { return it.str && it.str.trim(); }).map(function (it) { return { s: it.str.trim(), x: it.transform[4], y: Math.round(it.transform[5]), w: it.width }; });
      // تجميع حسب السطر
      items.sort(function (a, b) { return b.y - a.y || b.x - a.x; });
      var lines = [];
      items.forEach(function (it) {
        var L = lines.length ? lines[lines.length - 1] : null;
        if (L && Math.abs(L.y - it.y) <= 3) L.items.push(it); else lines.push({ y: it.y, items: [it] });
      });
      lines.forEach(function (L) {
        L.items.sort(function (a, b) { return b.x - a.x; }); // من اليمين لليسار
        var cells = [], last = null;
        L.items.forEach(function (it) {
          if (last && (last.x - (it.x + it.w)) < 6) cells[cells.length - 1] = it.s + ' ' + cells[cells.length - 1];
          else cells.push(it.s);
          last = it;
        });
        rows.push(cells);
      });
    });
    return rows;
  });
}

function runDistribute(onlyUnpinned) {
  var date = UI.date;
  var needed = E.neededSlots(S, date);
  if (!needed.length) { toast('لا توجد حصص تحتاج إلى تغطية — سجّل الغياب أولًا', 'err'); render(); return; }
  var approvedBefore = {};
  S.assignments.forEach(function (a) { if (a.date === date && (a.status === 'approved' || a.status === 'done')) approvedBefore[a.key] = a.subId; });
  var plan = E.distribute(S, date, S.settings.mode, { keepApproved: false });
  // الحفاظ على الحالات (منفذة/معتمدة) للحصص التي لم يتغير معلمها
  plan.assignments.forEach(function (a) {
    var prev = S.assignments.filter(function (x) { return x.date === date && x.key === a.key; })[0];
    if (prev && prev.subId === a.subId && a.subId) { a.status = prev.status; a.seen = prev.seen; a.activityId = prev.activityId; a.manual = prev.manual; a.manualReason = prev.manualReason; a.pinned = prev.pinned; }
    else if (approvedBefore[a.key] && approvedBefore[a.key] !== a.subId) {
      notify(approvedBefore[a.key], 'تعديل: أُلغي إسناد حصة الاحتياط ' + pName(a.period) + ' للصف ' + a.cls + ' بتاريخ ' + date + '.', a.id);
      if (a.subId) a.status = 'proposed';
    }
  });
  E.applyPlan(S, plan);
  if (S.approvedDays[date] && plan.assignments.some(function (a) { return a.status === 'proposed'; })) S.approvedDays[date] = false;
  var errs = E.validateDay(S, date);
  commit(onlyUnpinned ? 'إعادة توزيع الحصص غير المثبتة' : 'توزيع حصص الاحتياط', date + ' — ' + E.MODES[plan.mode] + ' — مغطاة ' + plan.covered + '/' + plan.total + (plan.notes.length ? ' — ' + plan.notes.join('؛ ') : ''));
  toast(plan.mode === 'manual' ? 'جاهز للإسناد اليدوي (' + plan.total + ' حصة)' : 'تم التوزيع: ' + plan.covered + ' من ' + plan.total + ' حصة' + (plan.uncovered ? ' — ' + plan.uncovered + ' دون تغطية' : ''), plan.uncovered ? '' : 'ok');
  if (errs.length) toast('تنبيه: ' + errs[0], 'err');
}

async function manageDailyShare(action, schoolId, date, root) {
  if (root.dataset.shareBusy) return false;
  root.dataset.shareBusy = 'true';
  var buttons = $$('.modal-f button:not(:disabled)', root);
  buttons.forEach(function (button) { button.disabled = true; });
  var controller = new AbortController();
  var timeout;
  try {
    var context = Store.shareContext();
    if (action === 'create' && !context?.expectedRevision && !Store.hasConflict) {
      await Store.retry();
      context = Store.shareContext();
    }
    if (!root.isConnected || !context || S?.id !== schoolId || !can('approve')) return false;
    if (action === 'create') {
      if (!dailyShareApproved(S, date)) {
        toast('اعتمد الجدول أولًا', 'err');
        return false;
      }
      if (!context.expectedRevision) {
        toast(Store.hasConflict ? 'راجع تعارض الحفظ قبل مشاركة الجدول' : 'انتظر حفظ الجدول ثم حاول مجددًا', 'err');
        return false;
      }
    }
    timeout = setTimeout(function () { controller.abort(); }, 12000);
    var response = await fetch('/api/ihtiyat-share', {
      method: 'POST', credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action, ownerId: context.ownerId, schoolId: schoolId, date: date,
        ...(action === 'create' ? { expectedRevision: context.expectedRevision } : {}) })
    });
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok) {
      if (response.status === 401 || response.status === 403 || data.error === 'workspace_conflict') void Store.retry();
      var message = {
        schedule_not_approved: 'اعتمد الجدول واحفظه قبل إنشاء الرابط',
        workspace_conflict: 'تغيّرت نسخة الجدول. راجعها ثم أعد المحاولة',
        subscription_required: 'يتطلب نشر الجدول اشتراكًا ساريًا',
        account_stopped: 'حساب التحضير الذكي موقوف',
        sign_in_required: 'سجّل الدخول بحساب التحضير الذكي'
      }[data.error];
      toast(message || 'تعذّر تعديل رابط العرض. حاول مجددًا.', 'err');
      return false;
    }
    if (!root.isConnected || Store.shareContext()?.ownerId !== context.ownerId || S?.id !== schoolId) return false;
    if (action === 'revoke') {
      toast('أُلغي رابط العرض لهذا اليوم', 'ok');
    } else {
      if (!/^[A-Za-z0-9_-]{43}$/.test(data.token || '') || !Number.isFinite(Date.parse(data.expiresAt))) {
        toast('تعذّر تجهيز رابط العرض. حاول مجددًا.', 'err');
        return false;
      }
      setTimeout(function () {
        if (Store.shareContext()?.ownerId === context.ownerId && S?.id === schoolId) showDailyShareLink(data);
      }, 0);
    }
    return true;
  } catch (error) {
    if (root.isConnected) toast('تعذّر الاتصال بخدمة مشاركة الجدول. حاول مجددًا.', 'err');
    return false;
  } finally {
    clearTimeout(timeout);
    delete root.dataset.shareBusy;
    buttons.forEach(function (button) { button.disabled = false; });
  }
}

function showDailyShareLink(data) {

function managePublicReport(root, ownerId, schoolId) {
  var panel = $('#public-report-content', root);
  var link = null;
  var busy = false;
  function isCurrent() {
    return root.isConnected && Store.shareContext()?.ownerId === ownerId && S?.id === schoolId;
  }
  function showLink() {
    if (!link) {
      panel.innerHTML = '<div class="row"><button class="btn pri" type="button" data-report-action="create">إنشاء رابط التقارير</button></div>';
      return;
    }
    panel.innerHTML = '<label class="f">رابط التقارير<input id="public-report-url" dir="ltr" value="' + esc(link) + '" readonly></label>' +
      '<div class="row" style="margin-top:10px"><button class="btn pri" type="button" data-report-action="copy">نسخ الرابط</button>' +
      '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">فتح التقارير</a>' +
      '<button class="btn danger" type="button" data-report-action="revoke">إيقاف الرابط</button></div>';
  }
  async function request(action) {
    if (busy || !isCurrent()) return;
    busy = true;
    if (action === 'get') panel.innerHTML = '<p class="muted" role="status">جارٍ التحقق من رابط التقارير…</p>';
    var buttons = $$('button', panel);
    buttons.forEach(function (button) { button.disabled = true; });
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 12000);
    try {
      var response = await fetch('/api/ihtiyat-report', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store', signal: controller.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, ownerId: ownerId, schoolId: schoolId })
      });
      var data = await response.json().catch(function () { return {}; });
      if (!isCurrent()) return;
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) void Store.retry();
        throw new Error(response.status === 404 ? 'احفظ بيانات المدرسة ثم حاول مجددًا.' : 'تعذّر تحديث رابط التقارير. حاول مجددًا.');
      }
      if ((action === 'revoke' && data.revoked === true) || (action === 'get' && data.token === null)) {
        link = null;
      } else if (typeof data.token === 'string' && /^[A-Za-z0-9_-]{43}$/.test(data.token)) {
        var url = new URL('/cc/report.html', location.origin);
        url.hash = new URLSearchParams({ token: data.token }).toString();
        link = url.href;
      } else {
        throw new Error('تعذّر تجهيز رابط التقارير. حاول مجددًا.');
      }
      showLink();
      if (action === 'revoke') toast('أُوقف رابط التقارير العامة', 'ok');
    } catch (error) {
      if (!isCurrent()) return;
      var message = error instanceof TypeError || error.name === 'AbortError' ? 'تعذّر الاتصال بخدمة التقارير.' : error.message;
      if (action === 'get') {
        panel.innerHTML = '<p class="muted" role="status">' + esc(message) + '</p>' +
          '<button class="btn" type="button" data-report-action="get">إعادة المحاولة</button>';
      } else toast(message, 'err');
    } finally {
      clearTimeout(timer);
      busy = false;
      buttons.forEach(function (button) { button.disabled = false; });
    }
  }
  panel.addEventListener('click', function (event) {
    var action = event.target.closest('button[data-report-action]')?.dataset.reportAction;
    if (!isCurrent()) return;
    if (action === 'copy' && link) copyText(link);
    if (['get', 'create', 'revoke'].includes(action)) void request(action);
  });
  void request('get');
}

  { t: 'بيانات المدرسة', d: 'الاسم والنوع والشعار' },

function wzState() {
  if (!APP.setup) APP.setup = { step: 0, users: managementDrafts() };

}
function managementDrafts(users) {
  var existing = Array.isArray(users) ? users : [];
  var ids = new Set();
  return MANAGEMENT_ROLES.map(function (role) {
    var user = existing.find(function (u) { return u?.role === role; });
    var id = typeof user?.id === 'string' && user.id && !ids.has(user.id) ? user.id : E.uid('u');
    ids.add(id);
    return { id: id, name: typeof user?.name === 'string' ? user.name : '', role: role, pin: String(user?.pin ?? '') };
  });
}
function draftUserProblem(u) {
  if (!u.name || !u.name.trim()) return 'الاسم مطلوب';
  if (!/^\d{4,8}$/.test(u.pin || '')) return 'الرمز من 4 إلى 8 أرقام';
  return null;
}
function usersStatus(list) {
  var ok = list.filter(function (u) { return !draftUserProblem(u); });
  var dup = new Set(ok.map(function (u) { return u.name.trim(); })).size !== ok.length;
  var valid = list.length === MANAGEMENT_ROLES.length && !dup && MANAGEMENT_ROLES.every(function (role) {
    return ok.some(function (u) { return u.role === role; });
  });
  return { ok: ok.length, dup: dup, valid: valid };
}
function wzChecks() {
  var st = S.settings, W = wzState();
  var lessons = 0; for (var k in S.schedule) lessons += Object.keys(S.schedule[k]).length;
  var us = usersStatus(W.users);
  return [
    { ok: !!(st.name && st.name.trim() && st.name !== 'مدرستي'), t: 'بيانات المدرسة', d: st.name, need: 'اكتب اسم المدرسة', step: 0 },

    { ok: S.teachers.length > 0 && lessons > 0, t: 'الجدول المدرسي', d: S.teachers.length + ' معلمًا · ' + lessons + ' حصة · ' + E.allClasses(S).length + ' صفًا', need: 'ارفع ملف Excel للجدول ثم اضغط «اعتماد هذا الجدول»', step: 2 },
    { ok: +st.defaultMaxDaily > 0 && +st.defaultMaxWeekly >= +st.defaultMaxDaily, t: 'قواعد الاحتياط', d: 'حد يومي ' + st.defaultMaxDaily + ' · أسبوعي ' + st.defaultMaxWeekly + ' · ' + E.MODES[st.mode], need: 'تأكد من صحة الحدين اليومي والأسبوعي', step: 3 },
    { ok: us.valid, t: 'المستخدمون', d: us.ok + ' من ' + MANAGEMENT_ROLES.length + ' مكتمل' + (us.dup ? ' · أسماء مكررة' : ''), need: 'أكمل بيانات مدير النظام ومدير المدرسة', step: 4 }

}
function ttUploader(scope) {

}
ACT.ttTemplate = function () {

  exportXlsx('نموذج-الجدول-المدرسي.xlsx', [{ name: 'الجدول المدرسي', rows: rows, widths: [30, 18, 15, 11].concat(range(st.periods).map(function () { return 14; })), freeze: true, border: true }, { name: 'تعليمات', rows: help, widths: [100], header: true }]);
};
var ttReadId = 0;
function handleTTFile(file, scope) {

  }).catch(function (e) {

    '<div class="kpis">' + kpi('المعلمون', r.teachers.length, r.teachers.length ? 'ok' : 'bad') + kpi('الحصص التدريسية', r.lessons.length, r.lessons.length ? 'ok' : 'bad') + kpi('مهام ومناوبات', r.blocks.length) + kpi('الصفوف', Object.keys(cls).length) + kpi('صفوف بها أخطاء', r.errors.length, r.errors.length ? 'warn' : 'ok') + '</div>' +
    (ok && r.requiredPeriods > S.settings.periods ? '<div class="note small" style="margin-top:8px">سيُضبط عدد الحصص اليومي إلى <b>' + r.requiredPeriods + '</b> عند اعتماد هذا الجدول.</div>' : '') +
