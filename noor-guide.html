  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f7faf9;color:#172b29;font-family:Tahoma,Arial,sans-serif;line-height:1.7;--card-accent:#0f766e}
    .noor-guide{max-width:1060px;margin:auto;padding:24px 20px 48px}
    .guide-back{display:inline-flex;align-items:center;gap:8px;color:#0f766e;font-weight:700;text-decoration:none;min-height:44px}
    .guide-back:hover{text-decoration:underline}
    h1{font-size:1.8rem;margin:14px 0 4px;overflow-wrap:anywhere}
    h2{font-size:1.2rem;margin:0 0 12px}
    .guide-intro{margin:0 0 24px;color:#526764}
    .noor-guide section{margin-top:22px}
    .noor-guide a{overflow-wrap:anywhere}
    .noor-tool-link{text-align:center;max-width:100%}
    .noor-tool-link + .noor-tool-link{margin-inline-start:4px}
    @media(max-width:480px){.noor-guide{padding-inline:16px}h1{font-size:1.5rem}}
    .noor-device-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:4px 0 18px}
    .noor-device-grid[data-recommended]{grid-template-columns:minmax(0,1fr)}
    .noor-device-grid [hidden]{display:none!important}
    .noor-device-panel{border-top:1px solid rgba(214,225,238,.95);padding-top:14px;min-width:0}
    .noor-inline-player{margin:12px 0;max-width:760px;overflow:hidden;border:1px solid #d6e5e3;border-radius:8px;background:#fff}
    .noor-inline-player[hidden]{display:none}
    .noor-player-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;color:#174340;font-size:.88rem;overflow-wrap:anywhere}
    .noor-player-close{width:36px;height:36px;flex-shrink:0;border:0;border-radius:6px;background:#eaf6f3;color:#174340;font:inherit;font-size:1.25rem;cursor:pointer}
    .noor-inline-player video{display:block;width:100%;height:auto;max-height:65vh;background:#111}
    .noor-help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:12px}
    .noor-help-group:first-child{grid-column:1/-1}
    .noor-help-group h3{font-size:.9rem;color:#0f766e;margin-bottom:8px}
    .noor-help-group ol{list-style:decimal;padding-inline-start:1.55rem}
    .noor-help-group li{padding-inline-start:.2rem;margin-bottom:6px}
    .noor-help-group li::marker{color:#0f766e;font-weight:800}
    .noor-help-group a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border:1px solid #d6e5e3;border-radius:7px;color:#174340;background:#f7fcfb;text-decoration:none;font-weight:700;overflow-wrap:anywhere}
    .noor-help-group a:hover,.noor-help-group a:focus-visible{background:#eaf6f3;border-color:#0f766e}
    .noor-help-group a span:last-child{color:#0f766e;flex-shrink:0}
    @media(max-width:680px){.noor-help-grid{grid-template-columns:minmax(0,1fr);gap:12px}}
    .noor-device-panel h3{font-size:.96rem;font-weight:900;color:#0a1628;margin-bottom:9px}
    .noor-device-panel p{font-size:.82rem;line-height:1.8;margin:0;color:#5b718b;max-width:none}
    .noor-tool-link.noor-video-link{min-width:42px;padding-inline:10px;font-size:1rem;vertical-align:middle}
    .noor-tool-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--card-accent,#0f3d9e);color:#fff;text-decoration:none;font-size:.84rem;font-weight:900;box-shadow:0 10px 22px color-mix(in srgb, var(--card-accent,#0f3d9e) 22%, transparent)}
    .noor-coming-soon{display:inline-flex;margin-top:12px;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(214,225,238,.9);font-size:.78rem;font-weight:900;color:#526b86}
    @media(max-width:900px){.noor-device-grid{grid-template-columns:1fr}}
    .guide-sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px 0 24px}
    .guide-section-link{display:flex;align-items:center;gap:10px;min-height:72px;padding:13px 14px;border:1px solid #d6e5e3;border-radius:15px;background:#fff;color:#174340;text-decoration:none;font-weight:900;box-shadow:0 8px 20px rgba(23,67,64,.05);transition:transform .18s ease,background .18s ease,border-color .18s ease}
    .guide-section-link:hover,.guide-section-link:focus-visible{transform:translateY(-2px);background:#f7fcfb;border-color:#0f766e;outline:none}
    .guide-section-icon{font-size:21px;line-height:1}
    .guide-section-link small{display:block;margin-top:3px;color:#607a77;font-size:.72rem;font-weight:700;line-height:1.5}
    .guide-related{margin:4px 0 24px;padding:15px;border:1px solid #d6e5e3;border-radius:16px;background:#effbf8}
    .guide-related h2{font-size:1rem;color:#174340;margin-bottom:10px}
    .guide-related-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .guide-related-link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 12px;border-radius:12px;background:#fff;border:1px solid #d6e5e3;color:#174340;text-decoration:none;font-size:.84rem;font-weight:900}
    .guide-related-link:hover,.guide-related-link:focus-visible{background:#eaf6f3;border-color:#0f766e;outline:none}
    @media(max-width:680px){.guide-sections{grid-template-columns:1fr}.guide-related-links{grid-template-columns:1fr}}
  </style>

</head>
<body>
  <main class="noor-guide">
    <a class="guide-back" href="index.html"><span aria-hidden="true">→</span> الصفحة الرئيسية</a>
    <h1>أداة التعبئة وشروحات</h1>
    <p class="guide-intro">صفحة مختصرة للوصول إلى الاشتراك وتنزيل أداة التعبئة وإدراج الطلبة.</p>
    <section aria-labelledby="guide-sections-title">
      <h2 id="guide-sections-title">أقسام البطاقة رقم 1</h2>
      <div class="guide-sections">
        <a class="guide-section-link" href="subscription.html"><span class="guide-section-icon" aria-hidden="true">💳</span><span>الاشتراك<small>تفعيل المواد ورفع الإيصال</small></span></a>
        <a class="guide-section-link" href="https://chromewebstore.google.com/detail/%D8%AA%D8%B9%D8%A8%D8%A6%D8%A9-%D8%AA%D8%AD%D8%B6%D9%8A%D8%B1-%D8%A7%D9%84%D8%AF%D8%B1%D9%88%D8%B3-%D9%86%D9%88%D8%B1/fgdlajfbjmobhaeabmgdfgmecpjjlmng" data-extension-router target="_blank" rel="noopener noreferrer"><span class="guide-section-icon" aria-hidden="true">🧩</span><span>أداة التعبئة<small>تنزيل الإضافة المناسبة لكروم أو فايرفوكس</small></span></a>
        <a class="guide-section-link" href="students.html"><span class="guide-section-icon" aria-hidden="true">👥</span><span>إدراج الطلبة<small>استيراد القائمة من Excel</small></span></a>
      </div>
    </section>
  </main>
<script>
(function () {
  const link = document.querySelector('[data-extension-router]');
  if (!link) return;
  const firefoxUrl = 'https://addons.mozilla.org/en-US/firefox/addon/%D8%A7%D9%84%D8%AA%D8%AD%D8%B6%D9%8A%D8%B1-%D8%A7%D9%84%D8%B0%D9%83%D9%8A-%D9%84%D9%84%D9%85%D8%B9%D9%84%D9%85-%D8%A7%D9%84%D8%B9%D9%85%D8%A7%D9%86%D9%8A/';
  const isFirefox = /Firefox\/|FxiOS\//i.test(navigator.userAgent || '');
  if (isFirefox) link.href = firefoxUrl;
})();
</script>
<script>
(function () {
  const grid = document.querySelector('.noor-guide .noor-device-grid');
  if (!grid) return;
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod|FxiOS|CriOS/i.test(ua) ||
    (/Mac/i.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
  const mobile = /Android|Mobile|Tablet/i.test(ua) || navigator.userAgentData?.mobile;
  const device = ios ? 'ios' : mobile ? 'android' : 'desktop';
  const firefox = /Firefox\//i.test(ua);
  const chrome = /Chrome\//i.test(ua) && !/Edg|OPR|SamsungBrowser|Vivaldi|YaBrowser/i.test(ua) &&
    !navigator.brave;
  const browser = firefox ? 'firefox' : chrome ? 'chrome' : '';
  grid.dataset.recommended = device;
  grid.querySelectorAll('[data-device]').forEach(panel => {
    panel.hidden = panel.dataset.device !== device;
  });
  const panel = grid.querySelector('[data-device="' + device + '"]');
  const heading = panel.querySelector('h3');
  if (device === 'desktop') {
    if (browser) {
      const name = firefox ? 'فايرفوكس' : 'كروم';
      heading.textContent = 'أداة التعبئة لـ' + name + ' على الحاسب';
    } else {
      heading.textContent = 'أدوات التعبئة للحاسب: فايرفوكس أو كروم';
    }
    panel.querySelectorAll('[data-browser]').forEach(link => {
      link.hidden = Boolean(browser) && link.dataset.browser !== browser;
    });
  } else if (device === 'android') {
    heading.textContent = 'أداة التعبئة لفايرفوكس على أندرويد';
  } else {
    heading.textContent = 'أدوات كروم وفايرفوكس عبر Orion Browser by Kagi على آيفون وآيباد';
  }
  if (device === 'android' && !firefox) {
    const desktopChrome = grid.querySelector('[data-browser="chrome"]').cloneNode(true);
    desktopChrome.hidden = false;
    desktopChrome.textContent = 'بديل: أداة كروم للحاسب';
    panel.appendChild(desktopChrome);
  }
})();
</script>
<script>
(function () {
  const card = document.querySelector('.noor-guide');
  if (!card) return;
  const player = document.createElement('div');
  player.className = 'noor-inline-player';
  player.innerHTML = '<div class="noor-player-heading"><strong></strong><button type="button" class="noor-player-close" aria-label="إغلاق الفيديو" title="إغلاق الفيديو">&times;</button></div><video controls playsinline preload="none"></video>';
  const video = player.querySelector('video');
  const title = player.querySelector('strong');
  const close = player.querySelector('button');
  let trigger = null;

  function stopVideo(restoreFocus) {
    if (!trigger) return;
    video.pause();
    video.removeAttribute('src');
    video.load();
    player.remove();
    if (restoreFocus) trigger.focus();
    trigger = null;
  }

  card.addEventListener('click', event => {
    const link = event.target.closest('a[data-noor-video]');
    if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    if (trigger === link) { stopVideo(true); return; }
    stopVideo(false);
    trigger = link;
    title.textContent = link.getAttribute('aria-label') || link.querySelector('span')?.textContent || link.textContent;
    video.setAttribute('aria-label', title.textContent);
    (link.closest('li') || link.closest('.noor-device-panel')).appendChild(player);
    video.src = link.href;
    const playback = video.play();
    if (playback) playback.catch(() => {});
    close.focus({ preventScroll: true });
    player.scrollIntoView({ block: 'nearest' });
  });
  close.addEventListener('click', () => stopVideo(true));
  player.addEventListener('keydown', event => {
    if (event.key === 'Escape') stopVideo(true);
  });
})();
</script>
