<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إدارة كلمات مرور المستخدمين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #182230;
      --muted: #667085;
      --line: #d9e0ea;
      --blue: #1769aa;
      --blue2: #0d4f85;
      --green: #12805c;
      --red: #b42318;
      --soft: #eef6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Tajawal", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(16px, 3vw, 34px);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.2;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 42px;
      display: grid;
      gap: 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.06);
    }
    .login-grid, .filter-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .filter-grid {
      grid-template-columns: minmax(220px, 2fr) minmax(160px, 1fr) auto;
    }
    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    input, select, button {
      font: inherit;
      min-height: 42px;
      border-radius: 7px;
    }
    input, select {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
    }
    button {
      border: 0;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      padding: 9px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--blue2); }
    button.secondary {
      background: #eef2f7;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.secondary:hover { background: #e4e9f2; }
    button.success { background: var(--green); }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      min-height: 24px;
    }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .hidden { display: none !important; }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      background: #fff;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      vertical-align: middle;
      font-size: 14px;
    }
    th {
      background: var(--soft);
      color: #24415f;
      font-weight: 800;
      position: sticky;
      top: 0;
    }
    tr:last-child td { border-bottom: 0; }
    .muted { color: var(--muted); }
    .user-id {
      direction: ltr;
      text-align: left;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .password-cell {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto;
      gap: 8px;
    }
    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .login-grid, .filter-grid { grid-template-columns: 1fr; }
      button { width: 100%; }
      .toolbar { align-items: stretch; }
      .password-cell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>إدارة كلمات مرور المستخدمين</h1>
      <p class="status">صفحة مخصصة للمدير لتصفية الحسابات وتغيير الرقم السري.</p>
    </div>
    <a href="/enjazy/admin.html" style="color:var(--blue);font-weight:800;text-decoration:none">لوحة إدارة إنجازي</a>
  </header>

  <main>
    <section id="login-panel" class="panel">
      <div class="login-grid">
        <label>
          كلمة مرور المدير
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD">
        </label>
        <button id="login-btn" type="button">دخول المدير</button>
      </div>
      <p id="login-status" class="status"></p>
    </section>

    <section id="users-panel" class="panel hidden">
      <div class="toolbar">
        <div>
          <h2 style="margin:0 0 5px;font-size:22px">المستخدمون</h2>
          <p id="users-status" class="status">جار تحميل الحسابات...</p>
        </div>
        <button id="logout-btn" type="button" class="secondary">خروج المدير</button>
      </div>

      <div class="filter-grid" style="margin-top:16px">
        <label>
          بحث بالاسم أو رقم الهاتف أو رقم المستخدم
          <input id="search-input" type="search" placeholder="اكتب جزءًا من البيانات...">
        </label>
        <label>
          ترتيب النتائج
          <select id="sort-select">
            <option value="updated">الأحدث تحديثًا</option>
            <option value="name">الاسم</option>
            <option value="contact">رقم الهاتف</option>
            <option value="entries">عدد السجلات</option>
          </select>
        </label>
        <button id="refresh-btn" type="button" class="secondary">تحديث</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>رقم الهاتف / الحساب</th>
              <th>رقم المستخدم</th>
              <th>السجلات</th>
              <th>آخر تحديث</th>
              <th>تعديل الرقم السري</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
        <div id="empty-state" class="empty hidden">لا توجد نتائج مطابقة للفلتر.</div>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_SESSION_KEY = "enjazy_admin_session_v1";
    const state = {
      adminPassword: "",
      accounts: [],
      filter: "",
      sort: "updated",
    };

    const el = {
      loginPanel: document.getElementById("login-panel"),
      usersPanel: document.getElementById("users-panel"),
      adminPassword: document.getElementById("admin-password"),
      loginBtn: document.getElementById("login-btn"),
      logoutBtn: document.getElementById("logout-btn"),
      refreshBtn: document.getElementById("refresh-btn"),
      loginStatus: document.getElementById("login-status"),
      usersStatus: document.getElementById("users-status"),
      searchInput: document.getElementById("search-input"),
      sortSelect: document.getElementById("sort-select"),
      usersBody: document.getElementById("users-body"),
      emptyState: document.getElementById("empty-state"),
    };

    function showStatus(target, text, type = "") {
      target.textContent = text || "";
      target.className = `status ${type}`.trim();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[ch]));
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";
      return date.toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" });
    }

    async function apiJson(url, options = {}, requiresAdmin = true) {
      const headers = { ...(options.headers || {}) };
      if (requiresAdmin) headers["x-admin-password"] = state.adminPassword;
      const res = await fetch(url, { ...options, headers });
      let data = {};
      try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) {
        const message = data.message || data.error || "تعذر تنفيذ الطلب.";
        throw new Error(message);
      }
      return data;
    }

    function setLoggedIn(isLoggedIn) {
      el.loginPanel.classList.toggle("hidden", isLoggedIn);
      el.usersPanel.classList.toggle("hidden", !isLoggedIn);
    }

    async function login() {
      const password = String(el.adminPassword.value || "").trim();
      if (!password) {
        showStatus(el.loginStatus, "أدخل كلمة مرور المدير.", "err");
        return;
      }
      el.loginBtn.disabled = true;
      showStatus(el.loginStatus, "جار التحقق من كلمة مرور المدير...");
      try {
        state.adminPassword = password;
        await apiJson("/api/admin?action=login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        }, false);
        sessionStorage.setItem(ADMIN_SESSION_KEY, password);
        setLoggedIn(true);
        showStatus(el.loginStatus, "");
        await loadAccounts();
      } catch (error) {
        state.adminPassword = "";
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        showStatus(el.loginStatus, "كلمة مرور المدير غير صحيحة أو غير مضبوطة.", "err");
      } finally {
        el.loginBtn.disabled = false;
      }
    }

    function logout() {
      state.adminPassword = "";
      state.accounts = [];
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      el.adminPassword.value = "";
      setLoggedIn(false);
      renderAccounts();
      showStatus(el.loginStatus, "تم تسجيل خروج المدير.", "ok");
    }

    async function loadAccounts() {
      showStatus(el.usersStatus, "جار تحميل الحسابات...");
      try {
        const out = await apiJson("/api/admin?action=accounts", { method: "GET" });
        state.accounts = Array.isArray(out.accounts) ? out.accounts : [];
        renderAccounts();
      } catch (error) {
        showStatus(el.usersStatus, error.message || "تعذر تحميل الحسابات.", "err");
      }
    }

    function getFilteredAccounts() {
      const term = state.filter.trim().toLowerCase();
      let items = state.accounts.slice();
      if (term) {
        items = items.filter((account) => {
          const profile = account.profile || {};
          const haystack = [
            account.userId,
            profile.name,
            profile.contact,
            profile.school,
            profile.subject,
            profile.grades,
          ].join(" ").toLowerCase();
          return haystack.includes(term);
        });
      }
      items.sort((a, b) => {
        const ap = a.profile || {};
        const bp = b.profile || {};
        if (state.sort === "name") return String(ap.name || "").localeCompare(String(bp.name || ""), "ar");
        if (state.sort === "contact") return String(ap.contact || "").localeCompare(String(bp.contact || ""), "ar");
        if (state.sort === "entries") return Number(b.entriesCount || 0) - Number(a.entriesCount || 0);
        return new Date(b.updatedAt || 0).getTime() - new Date(a.updatedAt || 0).getTime();
      });
      return items;
    }

    function renderAccounts() {
      const items = getFilteredAccounts();
      el.usersBody.innerHTML = items.map((account) => {
        const profile = account.profile || {};
        const userId = String(account.userId || "");
        return `
          <tr>
            <td>${escapeHtml(profile.name || "-")}</td>
            <td>${escapeHtml(profile.contact || "-")}</td>
            <td class="user-id">${escapeHtml(userId)}</td>
            <td>${escapeHtml(account.entriesCount || 0)}</td>
            <td>${escapeHtml(formatDate(account.updatedAt))}</td>
            <td>
              <div class="password-cell">
                <input type="password" minlength="4" placeholder="رقم سري جديد" data-password-for="${escapeHtml(userId)}">
                <button type="button" class="success" data-update-password="${escapeHtml(userId)}">حفظ</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
      el.emptyState.classList.toggle("hidden", items.length > 0);
      const total = state.accounts.length;
      showStatus(el.usersStatus, `عدد الحسابات: ${total} | المعروض: ${items.length}`, "ok");
    }

    async function updatePassword(userId) {
      const input = el.usersBody.querySelector(`input[data-password-for="${CSS.escape(userId)}"]`);
      const newPassword = String(input?.value || "");
      if (newPassword.length < 4) {
        showStatus(el.usersStatus, "الرقم السري الجديد يجب أن يكون 4 أحرف على الأقل.", "err");
        input?.focus();
        return;
      }
      const button = el.usersBody.querySelector(`button[data-update-password="${CSS.escape(userId)}"]`);
      button.disabled = true;
      showStatus(el.usersStatus, "جار حفظ الرقم السري الجديد...");
      try {
        await apiJson("/api/admin?action=update_password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, newPassword }),
        });
        input.value = "";
        showStatus(el.usersStatus, "تم تعديل الرقم السري بنجاح.", "ok");
        await loadAccounts();
      } catch (error) {
        showStatus(el.usersStatus, error.message || "تعذر تعديل الرقم السري.", "err");
      } finally {
        button.disabled = false;
      }
    }

    el.loginBtn.addEventListener("click", login);
    el.logoutBtn.addEventListener("click", logout);
    el.refreshBtn.addEventListener("click", loadAccounts);
    el.adminPassword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
    el.searchInput.addEventListener("input", () => {
      state.filter = el.searchInput.value || "";
      renderAccounts();
    });
    el.sortSelect.addEventListener("change", () => {
      state.sort = el.sortSelect.value || "updated";
      renderAccounts();
    });
    el.usersBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-update-password]");
      if (button) updatePassword(button.getAttribute("data-update-password"));
    });

    (async function init() {
      const saved = String(sessionStorage.getItem(ADMIN_SESSION_KEY) || "");
      if (!saved) return;
      state.adminPassword = saved;
      el.adminPassword.value = saved;
      setLoggedIn(true);
      try {
        await loadAccounts();
      } catch {
        logout();
      }
    })();
  </script>
</body>
</html>
