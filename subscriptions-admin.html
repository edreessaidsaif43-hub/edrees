<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة اشتراكات التحضير</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f6f8fb;color:#0f172a;padding:24px}
    .wrap{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    h1{margin:0;font-size:26px;color:#163b72}.panel,.card{background:#fff;border:1px solid #dbe4ef;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.06);padding:16px}
    .login{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:800;color:#475569}
    input,select,button,textarea{font-family:inherit}input,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;min-width:220px}
    button{border:none;border-radius:8px;padding:10px 14px;background:#1a56a0;color:white;font-weight:900;cursor:pointer}
    .btn-danger{background:#dc2626}.btn-ok{background:#15803d}.btn-muted{background:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:16px}
    .meta{font-size:13px;color:#64748b;line-height:1.8}.name{font-weight:900;color:#163b72;font-size:16px}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#e2e8f0}
    .status.active{background:#dcfce7;color:#166534}.status.pending{background:#fef3c7;color:#92400e}.status.rejected,.status.stopped{background:#fee2e2;color:#991b1b}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.receipt{display:inline-block;margin-top:10px;color:#1a56a0;font-weight:800}.hidden{display:none}.msg{font-size:13px;margin-top:8px;color:#64748b}.empty{text-align:center;color:#64748b;padding:30px}.note{width:100%;min-height:60px;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div><h1>إدارة اشتراكات التحضير</h1><div class="meta">مراجعة إيصالات الاشتراك وتفعيل الصفوف أو إيقافها عند وجود إيصال مخالف.</div></div>
      <a href="/" style="color:#1a56a0;font-weight:900;text-decoration:none">العودة للرئيسية</a>
    </div>
    <div class="panel" id="login-panel">
      <div class="login">
        <div class="field"><label>كلمة مرور الإدارة</label><input id="admin-password" type="password" placeholder="أدخل كلمة المرور"></div>
        <button onclick="loginAdmin()">دخول</button>
      </div>
      <div class="msg" id="login-msg"></div>
    </div>
    <div class="panel hidden" id="admin-panel">
      <div class="top"><div><strong>الإيصالات والاشتراكات</strong><div class="meta">رقم التحويل: 91470590</div></div><button class="btn-muted" onclick="loadSubscriptions()">تحديث</button></div>
      <div id="list" class="grid"></div>
    </div>
  </div>
<script>
let adminPassword = '';
function api(path){ return (location.protocol === 'file:' ? 'https://altahdir.app' : '') + path; }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusLabel(s){ return ({pending:'قيد المراجعة',active:'مفعل',rejected:'مرفوض',stopped:'متوقف'})[s] || s; }
async function loginAdmin(){
  adminPassword = document.getElementById('admin-password').value.trim();
  if(!adminPassword){ document.getElementById('login-msg').textContent='أدخل كلمة المرور.'; return; }
  document.getElementById('login-panel').classList.add('hidden');
  document.getElementById('admin-panel').classList.remove('hidden');
  await loadSubscriptions();
}
async function loadSubscriptions(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">جاري التحميل...</div>';
  try{
    const res = await fetch(api('/api/subscriptions?action=admin_list'), { headers: { 'x-admin-password': adminPassword } });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.message || 'تعذر تحميل الاشتراكات.');
    const items = data.subscriptions || [];
    if(!items.length){ list.innerHTML = '<div class="empty">لا توجد إيصالات حتى الآن.</div>'; return; }
    list.innerHTML = items.map(item => {
      const p = item.profile || {};
      return `<div class="card">
        <div class="top" style="margin-bottom:6px"><div class="name">${esc(p.name || item.userId)}</div><span class="status ${esc(item.status)}">${esc(statusLabel(item.status))}</span></div>
        <div class="meta">المستخدم: ${esc(item.userId)}<br>التواصل: ${esc(p.contact || '')}<br>الصف: <strong>${esc(item.grade)}</strong><br>آخر تحديث: ${esc(new Date(item.updatedAt).toLocaleString('ar-OM'))}</div>
        ${item.receiptUrl ? `<a class="receipt" href="${esc(item.receiptUrl)}" target="_blank" rel="noopener">فتح الإيصال: ${esc(item.receiptFileName || 'receipt')}</a>` : ''}
        <textarea class="note" id="note-${item.id}" placeholder="ملاحظة إدارية اختيارية">${esc(item.adminNote || '')}</textarea>
        <div class="actions">
          <button class="btn-ok" onclick="updateSub(${item.id}, 'active')">تفعيل الاشتراك</button>
          <button class="btn-danger" onclick="updateSub(${item.id}, 'stopped')">إيقاف الاشتراك</button>
          <button class="btn-muted" onclick="updateSub(${item.id}, 'rejected')">رفض الإيصال</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){ list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}
async function updateSub(id,status){
  const note = document.getElementById('note-'+id)?.value || '';
  const res = await fetch(api('/api/subscriptions?action=admin_update'), { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword }, body: JSON.stringify({ id, status, note }) });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){ alert(data.message || 'تعذر تحديث الاشتراك.'); return; }
  await loadSubscriptions();
}
</script>
</body>
</html>
