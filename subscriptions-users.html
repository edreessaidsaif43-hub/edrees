<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة المستخدمين المشتركين</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f6f8fb;color:#0f172a;padding:24px}
    .wrap{max-width:1180px;margin:auto}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    h1{margin:0;font-size:26px;color:#163b72}
    .meta{font-size:13px;color:#64748b;line-height:1.8}
    .panel{background:#fff;border:1px solid #dbe4ef;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.06);padding:16px}
    .login{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:12px;font-weight:800;color:#475569}
    input,button,textarea{font-family:inherit}
    input,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;min-width:220px}
    textarea{width:100%;min-height:78px;resize:vertical;font-size:13px;line-height:1.7;margin-top:8px}
    button{border:none;border-radius:8px;padding:10px 14px;background:#1a56a0;color:white;font-weight:900;cursor:pointer}
    button:disabled{background:#cbd5e1;cursor:not-allowed}
    .btn-danger{background:#dc2626}
    .btn-muted{background:#64748b}
    .hidden{display:none}
    .msg{font-size:13px;margin-top:8px;color:#64748b}
    .empty{text-align:center;color:#64748b;padding:30px}
    .table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:920px}
    th,td{border-bottom:1px solid #e2e8f0;padding:10px;vertical-align:middle;text-align:right}
    th{background:#f8fafc;color:#334155;font-size:12px;font-weight:900;position:sticky;top:0;z-index:1}
    td{font-size:13px}
    tr:hover td{background:#fbfdff}
    .name{font-weight:900;color:#163b72;font-size:14px}
    .status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#dcfce7;color:#166534;white-space:nowrap}
    .active-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .active-chip{display:inline-flex;max-width:100%;border:1px solid #bfdbfe;background:#eff6ff;color:#174ea6;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}
    .receipt-list{display:flex;gap:8px;flex-wrap:wrap}
    .receipt-item{width:98px}
    .receipt-view-button{display:block;width:92px;padding:0;border:0;border-radius:8px;background:transparent;color:inherit;cursor:pointer}
    .receipt-view-button:focus-visible{outline:3px solid rgba(26,86,160,.28);outline-offset:3px}
    .receipt-thumb{display:block;width:92px;height:70px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;object-fit:cover}
    .receipt-fallback{width:92px;height:70px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;font-weight:900;text-align:center}
    .receipt-name{display:block;margin-top:4px;color:#475569;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .receipt-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.76)}
    .receipt-modal.open{display:flex}
    .receipt-modal-content{position:relative;max-width:min(1100px,96vw);max-height:92vh;background:#fff;border-radius:8px;box-shadow:0 24px 70px rgba(15,23,42,.35);padding:14px}
    .receipt-modal-close{position:absolute;top:10px;left:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#0f172a;color:#fff;font-size:24px;line-height:1;padding:0}
    .receipt-modal-title{display:block;margin:0 48px 10px 0;color:#334155;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(96vw - 100px)}
    .receipt-modal-img{display:block;max-width:calc(96vw - 28px);max-height:calc(92vh - 72px);width:auto;height:auto;object-fit:contain}
    .edit-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;color:#475569;font-size:13px;font-weight:800}
    .pager-actions{display:flex;gap:8px;align-items:center}
    @media(max-width:760px){
      body{padding:12px}
      .table-wrap{border:0;overflow:visible;background:transparent}
      table,thead,tbody,tr,td{display:block;width:100%;min-width:0}
      table{min-width:0}
      thead{display:none}
      tr{background:#fff;border:1px solid #dbe4ef;border-radius:12px;box-shadow:0 8px 22px rgba(15,23,42,.06);margin-bottom:12px;overflow:hidden}
      td{border-bottom:1px solid #eef2f7}
      td::before{content:attr(data-label);display:block;font-size:11px;font-weight:900;color:#64748b;margin-bottom:5px}
      .receipt-view-button,.receipt-thumb,.receipt-fallback{width:100%;height:190px}
      .receipt-modal{padding:10px}
      .receipt-modal-content{max-width:100%;max-height:94vh;padding:10px}
      .receipt-modal-img{max-width:calc(100vw - 20px);max-height:calc(94vh - 68px)}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>متابعة المستخدمين المشتركين</h1>
        <div class="meta">عرض المستخدمين أصحاب الاشتراكات المفعلة مع صورة الإيصال وخيار إيقاف التفعيل.</div>
      </div>
      <div class="top">
        <a href="/subscriptions-admin.html" style="color:#1a56a0;font-weight:900;text-decoration:none">إدارة كل الاشتراكات</a>
        <a href="/" style="color:#1a56a0;font-weight:900;text-decoration:none">العودة للرئيسية</a>
      </div>
    </div>

    <div class="panel" id="login-panel">
      <div class="login">
        <div class="field">
          <label>كلمة مرور الإدارة</label>
          <input id="admin-password" type="password" placeholder="أدخل كلمة المرور">
        </div>
        <button onclick="loginAdmin()">دخول</button>
      </div>
      <div class="msg" id="login-msg"></div>
    </div>

    <div class="panel hidden" id="users-panel">
      <div class="top">
        <div>
          <strong>المستخدمون المشتركين</strong>
          <div class="meta">تظهر هنا الاشتراكات المفعلة فقط.</div>
        </div>
        <button class="btn-muted" onclick="loadUsers(1)">تحديث</button>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <div class="receipt-modal" id="receipt-modal" role="dialog" aria-modal="true" aria-label="معاينة صورة الإيصال" onclick="closeReceiptModal(event)">
    <div class="receipt-modal-content" onclick="event.stopPropagation()">
      <button class="receipt-modal-close" type="button" aria-label="إغلاق" onclick="closeReceiptModal()">×</button>
      <span class="receipt-modal-title" id="receipt-modal-title"></span>
      <img class="receipt-modal-img" id="receipt-modal-img" alt="صورة الإيصال بالحجم الطبيعي">
    </div>
  </div>

<script>
let adminPassword = '';
let usersPage = 1;
const PAGE_SIZE = 25;

function api(path){ return (location.protocol === 'file:' ? 'https://altahdir.app' : '') + path; }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsString(v){ return JSON.stringify(String(v ?? '')); }
function formatDate(value){ const d = value ? new Date(value) : null; return d && Number.isFinite(d.getTime()) ? d.toLocaleString('ar-OM') : ''; }
function isImageReceipt(item){ return String(item?.receiptFileType || '').startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(String(item?.receiptUrl || item?.receiptFileName || '')); }

function openReceiptModal(url, name){
  const modal = document.getElementById('receipt-modal');
  const image = document.getElementById('receipt-modal-img');
  const title = document.getElementById('receipt-modal-title');
  if(!modal || !image) return;
  image.src = url;
  image.alt = name || 'صورة الإيصال بالحجم الطبيعي';
  if(title) title.textContent = name || 'صورة الإيصال';
  modal.classList.add('open');
}

function closeReceiptModal(event){
  if(event && event.currentTarget !== event.target) return;
  const modal = document.getElementById('receipt-modal');
  const image = document.getElementById('receipt-modal-img');
  if(modal) modal.classList.remove('open');
  if(image) image.src = '';
}

function receiptCell(item){
  const receipts = Array.isArray(item.receipts) && item.receipts.length
    ? item.receipts
    : (item.receiptUrl ? [{ url: item.receiptUrl, fileName: item.receiptFileName, fileType: item.receiptFileType }] : []);
  const safeReceipts = receipts.slice(0, 5).filter(receipt => receipt && receipt.url);
  if(!safeReceipts.length) return '<div class="meta">لا توجد صورة إيصال آمنة للعرض.</div>';
  return '<div class="receipt-list">' + safeReceipts.map((receipt, index) => {
    const previewItem = { receiptUrl: receipt.url, receiptFileName: receipt.fileName, receiptFileType: receipt.fileType };
    const name = receipt.fileName || ('إيصال ' + (index + 1));
    const thumb = isImageReceipt(previewItem)
      ? '<button class="receipt-view-button" type="button" title="عرض الإيصال بالحجم الطبيعي" onclick="openReceiptModal(' + jsString(receipt.url) + ', ' + jsString(name) + ')"><img class="receipt-thumb" src="' + esc(receipt.url) + '" alt="صورة الإيصال ' + (index + 1) + '" loading="lazy"></button>'
      : '<div class="receipt-fallback">ملف غير صورة</div>';
    return '<div class="receipt-item">' + thumb + '<span class="receipt-name">' + esc(name) + '</span></div>';
  }).join('') + '</div>';
}

document.addEventListener('keydown', event => {
  if(event.key === 'Escape') closeReceiptModal();
});

function activeItemsCell(item){
  const values = String(item.activeItems || item.grade || '')
    .split('،')
    .map(value => value.trim())
    .filter(Boolean);
  const unique = [...new Set(values)];
  if(!unique.length) return '<div class="meta">لم يتم تحديد مادة.</div>';
  return '<div class="active-items">' + unique.map(value => '<span class="active-chip">' + esc(value) + '</span>').join('') + '</div>';
}

function editableItemsValue(item){
  const subjects = Array.isArray(item.activeSubjects) ? item.activeSubjects : [];
  if(subjects.length){
    return subjects
      .map(subject => ((subject.grade || '').trim() + ' - ' + (subject.subject || '').trim()).trim())
      .filter(value => value !== '-')
      .join('\n');
  }
  return String(item.activeItems || item.grade || '').split('،').map(value => value.trim()).filter(Boolean).join('\n');
}

function renderPager(page, count, hasMore){
  const start = count ? ((page - 1) * PAGE_SIZE) + 1 : 0;
  const end = count ? start + count - 1 : 0;
  return '<div class="pager"><div>عرض ' + start + ' - ' + end + '</div><div class="pager-actions"><button class="btn-muted" onclick="loadUsers(' + (page - 1) + ')" ' + (page <= 1 ? 'disabled' : '') + '>السابق</button><span>صفحة ' + page + '</span><button class="btn-muted" onclick="loadUsers(' + (page + 1) + ')" ' + (!hasMore ? 'disabled' : '') + '>التالي</button></div></div>';
}

async function loginAdmin(){
  adminPassword = document.getElementById('admin-password').value.trim();
  if(!adminPassword){ document.getElementById('login-msg').textContent='أدخل كلمة مرور الإدارة.'; return; }
  document.getElementById('login-panel').classList.add('hidden');
  document.getElementById('users-panel').classList.remove('hidden');
  await loadUsers(1);
}

async function loadUsers(page = usersPage){
  usersPage = Math.max(1, Number(page) || 1);
  const offset = (usersPage - 1) * PAGE_SIZE;
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">جاري التحميل...</div>';
  try{
    const res = await fetch(api('/api/subscriptions?action=admin_active_list&limit=' + PAGE_SIZE + '&offset=' + offset), { headers: { 'x-admin-password': adminPassword } });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.message || 'تعذر تحميل المستخدمين المشتركين.');
    const items = Array.isArray(data.subscriptions) ? data.subscriptions : [];
    if(usersPage > 1 && !items.length) return loadUsers(usersPage - 1);
    if(!items.length){ list.innerHTML = '<div class="empty">لا توجد اشتراكات مفعلة حالياً.</div>'; return; }
    const table = '<div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>الصف / المادة المفعلة</th><th>الإيصال</th><th>آخر تحديث</th><th>الإجراء</th></tr></thead><tbody>' + items.map(item => {
      const p = item.profile || {};
      return '<tr>' +
        '<td data-label="المستخدم"><div class="name">' + esc(p.name || item.userId) + '</div><div class="meta">ID: ' + esc(item.userId) + '<br>التواصل: ' + esc(p.contact || '') + '</div></td>' +
        '<td data-label="الصف / المادة المفعلة"><span class="status">مفعل</span>' + activeItemsCell(item) + '<textarea id="selection-' + item.id + '" placeholder="مثال: الصف الخامس - الرياضيات">' + esc(editableItemsValue(item)) + '</textarea><div class="edit-actions"><button class="btn-muted" onclick="saveUserSelection(' + jsString(item.userId) + ', ' + item.id + ')">حفظ الصف والمواد</button></div></td>' +
        '<td data-label="الإيصال">' + receiptCell(item) + '</td>' +
        '<td data-label="آخر تحديث"><div class="meta">' + esc(formatDate(item.updatedAt)) + '</div></td>' +
        '<td data-label="الإجراء"><button class="btn-danger" onclick="stopUserSubscription(' + jsString(item.userId) + ')">إيقاف التفعيل</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>';
    const pager = renderPager(usersPage, items.length, !!data.hasMore);
    list.innerHTML = pager + table + pager;
  }catch(e){
    list.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

async function stopUserSubscription(userId){
  if(!confirm('هل تريد إيقاف تفعيل كل اشتراكات هذا المستخدم؟')) return;
  const res = await fetch(api('/api/subscriptions?action=admin_stop_user'), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword },
    body: JSON.stringify({ userId, note: 'تم إيقاف التفعيل من صفحة متابعة المستخدمين المشتركين' })
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){ alert(data.message || 'تعذر إيقاف الاشتراك.'); return; }
  await loadUsers(usersPage);
}

async function saveUserSelection(userId, id){
  const input = document.getElementById('selection-' + id);
  const activeItems = input ? input.value.trim() : '';
  if(!activeItems){ alert('أدخل الصف والمواد بصيغة: الصف - المادة.'); return; }
  const res = await fetch(api('/api/subscriptions?action=admin_update_user_selection'), {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-admin-password': adminPassword },
    body: JSON.stringify({ userId, activeItems })
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){ alert(data.message || 'تعذر حفظ الصف والمواد.'); return; }
  await loadUsers(usersPage);
}
</script>
</body>
</html>
